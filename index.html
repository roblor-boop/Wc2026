<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC 2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>WC 2026 Sweepstake</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK for real-time sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   THEME SYSTEM — light default, .dark class for dark mode
   ══════════════════════════════════════════════════════════ */
:root {
  /* ── Light mode palette ─────────────────────────────── */
  --bg:       #f4f7fb;
  --bg2:      #edf1f7;
  --card:     #ffffff;
  --cardh:    #f8fafd;
  --inp:      #eef2f8;
  --b:        #dde6f0;
  --bb:       #bfcfe0;
  --gr:       #00802a;   /* slightly darker green = legible on white */
  --grd:      #006020;
  --gr-b:     #00e676;   /* bright accent for badges/highlights */
  --gold:     #a87800;
  --gold-d:   #c49200;
  --tx:       #0c1d32;
  --txd:      #3a5068;
  --txm:      #6a7f96;
  --red:      #be2020;
  --amber:    #a86000;
  --shadow:   0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 4px 24px rgba(0,0,0,.10);
  --hdr:      linear-gradient(135deg,#1e3a5f 0%,#0f2040 100%);
  --btn-tx:   #ffffff;
  --pill-gr:  rgba(0,128,42,.10);
  --pill-grbr:rgba(0,128,42,.30);
}
html.dark {
  /* ── Dark mode palette ──────────────────────────────── */
  --bg:       #06091a;
  --bg2:      #080c21;
  --card:     #0d1326;
  --cardh:    #111b38;
  --inp:      #090e20;
  --b:        #162040;
  --bb:       #1d2f58;
  --gr:       #00e676;
  --grd:      #00c853;
  --gr-b:     #00e676;
  --gold:     #ffd700;
  --gold-d:   #f59e0b;
  --tx:       #dde6f2;
  --txd:      #8898b2;
  --txm:      #475a70;
  --red:      #f05050;
  --amber:    #f59e0b;
  --shadow:   0 2px 8px rgba(0,0,0,.3), 0 4px 24px rgba(0,0,0,.4);
  --shadow-lg:0 4px 32px rgba(0,0,0,.5);
  --hdr:      linear-gradient(135deg,#09122a 0%,#060b1c 100%);
  --btn-tx:   #000000;
  --pill-gr:  rgba(0,230,118,.09);
  --pill-grbr:rgba(0,230,118,.28);
}
/* ── RESET & BASE ────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:'Barlow',sans-serif;min-height:100vh;transition:background .25s,color .25s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
input,select,button{font-family:'Barlow',sans-serif;outline:none}
/* ── LOADING ─────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:#06091a;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}
/* ── HEADER ──────────────────────────────────────────── */
#hdr{background:var(--hdr);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:50;box-shadow:0 2px 20px rgba(0,0,0,.25)}
#hdr-inner{max-width:1180px;margin:0 auto;padding:10px 14px 0}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hdr-ball{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00e676,#00b852);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;box-shadow:0 0 16px rgba(0,230,118,.35);cursor:pointer;user-select:none;transition:transform .15s}
.hdr-ball:active{transform:scale(.9)}
.hdr-meta{flex:1;min-width:0}
.hdr-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.07em;color:#fff;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-sub{font-family:'Oswald',sans-serif;font-size:.57rem;letter-spacing:.25em;color:#00e676;margin-top:1px;opacity:.8}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-info{text-align:right;font-size:.64rem;line-height:1.4}
.hbtn{width:30px;height:30px;border-radius:7px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.13);color:#fff;font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.dim{opacity:.38}
/* ── CHAMP BAR + PROGRESS ────────────────────────────── */
.champ-bar{margin-bottom:7px;padding:5px 11px;background:linear-gradient(90deg,rgba(255,215,0,.14),transparent);border:1px solid rgba(255,215,0,.38);border-radius:7px;display:flex;align-items:center;gap:7px;font-size:.75rem;color:#ffd700;letter-spacing:.03em}
.prog-wrap{margin-bottom:7px}
.prog-lbl{font-size:.57rem;color:rgba(255,255,255,.32);font-family:'Oswald',sans-serif;letter-spacing:.1em;margin-bottom:3px;display:flex;justify-content:space-between}
.prog-track{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#00e676,#00c853);border-radius:3px;transition:width .6s ease}
/* ── TABS ────────────────────────────────────────────── */
.tab-nav{display:flex;overflow-x:auto;gap:0}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{padding:9px 12px;font-size:.67rem;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:'Oswald',sans-serif;letter-spacing:.08em;color:rgba(255,255,255,.32);transition:color .18s,border-color .18s}
.tab-btn.active{color:#00e676;border-bottom-color:#00e676}
.tab-btn:disabled{cursor:not-allowed;opacity:.2}
/* ── LAYOUT ──────────────────────────────────────────── */
main{max-width:1180px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--card);border:1px solid var(--b);border-radius:11px;box-shadow:var(--shadow)}
.ttl{font-family:'Oswald',sans-serif;font-size:1.2rem;font-weight:700;color:var(--tx);margin-bottom:4px;letter-spacing:.03em}
.sub{color:var(--txd);font-size:.82rem;margin-bottom:16px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.grid-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
/* ── BUTTONS ─────────────────────────────────────────── */
.btn{padding:8px 18px;border:none;border-radius:7px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.07em;transition:all .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-green{background:linear-gradient(135deg,var(--gr),var(--grd));color:var(--btn-tx)}
.btn-ghost{background:transparent;border:1px solid var(--b);color:var(--txd)}
.btn-ghost:hover{border-color:var(--bb);background:var(--cardh)}
.btn-danger{background:transparent;border:1px solid rgba(192,32,32,.35);color:var(--red)}
.btn-sm{padding:3px 8px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:.63rem;letter-spacing:.04em;cursor:pointer;border:1px solid var(--b);background:transparent;color:var(--txd);transition:all .15s}
.btn-sm:hover{border-color:var(--bb);background:var(--cardh)}
.btn-draw{padding:14px 30px;background:linear-gradient(135deg,#00e676,#00b852);border:none;border-radius:9px;color:#000;font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.1em;cursor:pointer;box-shadow:0 4px 20px rgba(0,200,100,.3);animation:glow 2.5s ease-in-out infinite;transition:transform .15s}
.btn-draw:hover{transform:translateY(-1px)}
/* ── SCORE CONTROLS ──────────────────────────────────── */
.adj{width:32px;height:32px;border-radius:7px;background:var(--cardh);border:1px solid var(--b);color:var(--tx);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;font-weight:600}
.adj:hover{background:var(--b);border-color:var(--bb)}
.sval{width:30px;text-align:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:1.15rem;color:var(--tx)}
/* ── MATCH CARD ──────────────────────────────────────── */
.mc{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow)}
.mc:hover{box-shadow:var(--shadow-lg)}
.mc.played{border-left:3px solid var(--gr)}
.mc.live-now{border-left:3px solid var(--amber);animation:livePulse 2s ease-in-out infinite}
.mc-meta{display:flex;justify-content:space-between;align-items:flex-start;font-size:.61rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.05em;gap:4px}
.mc-teams{display:flex;align-items:center;gap:6px}
.mc-team{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.mc-team.home{justify-content:flex-end;flex-direction:row-reverse}
.mc-team .tf{font-size:1.3rem;flex-shrink:0;line-height:1}
.mc-team .tn{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:500}
.mc-team.win .tn{color:var(--gr);font-weight:700}
.mc-team.lose .tn{color:var(--txm);text-decoration:line-through}
.mc-team.lose .tf{opacity:.5}
.score-disp{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.35rem;padding:0 8px;min-width:52px;text-align:center;flex-shrink:0;color:var(--gr);line-height:1}
.score-disp.draw{color:var(--amber)}
.mc-foot{display:flex;justify-content:space-between;align-items:center}
.mc-lbl{font-size:.61rem;font-family:'Oswald',sans-serif;letter-spacing:.06em;color:var(--txm);height:16px}
.mc-lbl.win{color:var(--gr)}.mc-lbl.draw{color:var(--amber)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:4px;animation:liveDot 1.2s ease-in-out infinite}
/* ── CHANNEL BADGE ───────────────────────────────────── */
.ch-bbc{padding:1px 5px;border-radius:3px;font-size:.57rem;font-weight:700;font-family:'Oswald',sans-serif;background:rgba(0,72,148,.1);border:1px solid rgba(0,72,148,.32);color:#0044bb;letter-spacing:.04em}
html.dark .ch-bbc{background:rgba(0,100,220,.15);border-color:rgba(0,100,220,.4);color:#5599ff}
.ch-itv{padding:1px 5px;border-radius:3px;font-size:.57rem;font-weight:700;font-family:'Oswald',sans-serif;background:rgba(180,0,0,.08);border:1px solid rgba(180,0,0,.3);color:#bb0000;letter-spacing:.04em}
html.dark .ch-itv{background:rgba(255,40,40,.1);border-color:rgba(255,40,40,.35);color:#ff6666}
/* ── GROUP TABLE ─────────────────────────────────────── */
.gt{background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.gt.complete{border-color:var(--bb)}
.gt-hdr{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--cardh);border-bottom:1px solid var(--b)}
.gt-lbl{font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--gr);font-weight:700;letter-spacing:.12em}
.gt-row{display:grid;grid-template-columns:16px 1fr 22px 22px 22px 22px 24px 26px 26px 30px;align-items:center;gap:1px;padding:5px 10px;border-bottom:1px solid var(--b);border-bottom-width:.5px;transition:background .12s}
.gt-row:hover{background:var(--cardh)}
.gt-row.out{opacity:.5}
.gt-cell{font-size:.73rem;font-family:'Oswald',sans-serif;text-align:center;color:var(--txd)}
/* ── STANDINGS ───────────────────────────────────────── */
.sc{background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:hidden;margin-bottom:9px;box-shadow:var(--shadow);transition:box-shadow .2s}
.sc:hover{box-shadow:var(--shadow-lg)}
.sc.gold{border-color:rgba(168,120,0,.4);background:linear-gradient(135deg,rgba(168,120,0,.04),var(--card))}
html.dark .sc.gold{border-color:rgba(255,215,0,.3);background:linear-gradient(135deg,rgba(255,215,0,.05),var(--card))}
.sc-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.sc-body{border-top:1px solid var(--b);padding:10px 14px 12px;background:var(--cardh)}
.pill-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px 14px 10px}
.pill{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 6px;border-radius:20px;font-size:.74rem;border:1px solid transparent}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:700;flex-shrink:0}
.rank-chg{font-size:.58rem;font-family:'Oswald',sans-serif;font-weight:700;white-space:nowrap}
.rank-up{color:#00802a}.rank-dn{color:var(--red)}.rank-eq{color:var(--txm)}
/* ── KO CARD ─────────────────────────────────────────── */
.koc{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);transition:box-shadow .2s}
.koc:hover{box-shadow:var(--shadow-lg)}
.ko-slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;transition:background .12s}
.ko-slot.win{background:var(--pill-gr);border:1px solid var(--pill-grbr)}
.ko-slot.lose{opacity:.6}
/* ── BRACKET ─────────────────────────────────────────── */
.bk-wrap{overflow-x:auto;padding:4px 0 12px}
.bk-inner{display:flex;align-items:flex-start}
.bk-col{display:flex;flex-direction:column;flex-shrink:0}
.bk-rnd-hdr{font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.28);text-align:center;padding:5px 4px;white-space:nowrap}
.bk-match{width:170px;margin:2px 10px;border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--card);flex-shrink:0;position:relative;box-shadow:var(--shadow)}
.bk-match.final{border-color:rgba(168,120,0,.5);box-shadow:0 0 20px rgba(168,120,0,.15)}
html.dark .bk-match.final{border-color:rgba(255,215,0,.45);box-shadow:0 0 20px rgba(255,215,0,.1)}
.bk-slot{height:34px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:.73rem;transition:background .12s}
.bk-slot.w{background:var(--pill-gr)}
.bk-slot.l{opacity:.55}
.bk-slot .bn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.bk-slot.w .bn{color:var(--gr);font-weight:600}
.bk-slot.l .bn{color:var(--txm);text-decoration:line-through}
.bk-div{height:1px;background:var(--b)}
.bk-pair{position:relative;display:flex;flex-direction:column}
.bk-pair::after{content:'';position:absolute;right:-2px;top:calc(25% + 1px);height:50%;width:1px;background:var(--bb);pointer-events:none}
.bk-match.connector::after{content:'';position:absolute;right:-10px;top:50%;width:9px;height:1px;background:var(--bb)}
/* ── DRAW CARDS ──────────────────────────────────────── */
.dc{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px;animation:fadeUp .38s ease forwards;opacity:0;box-shadow:var(--shadow);transition:box-shadow .2s}
.dc-hdr{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.dc:hover{box-shadow:var(--shadow-lg)}
.dc.gld{border-color:rgba(168,120,0,.4)}
html.dark .dc.gld{background:linear-gradient(135deg,rgba(255,215,0,.06),var(--card));border-color:rgba(255,215,0,.28)}
.team-row{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--b);border-radius:7px;margin-bottom:4px;background:var(--cardh);transition:background .12s}
.team-row:hover{background:var(--bg2)}
.team-row.out{opacity:.5}
/* ── OVERLAY (Draw ceremony) ─────────────────────────── */
#ov{position:fixed;inset:0;z-index:100;background:rgba(3,5,15,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.ov-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(0,230,118,.07) 0%,transparent 60%)}
.ov-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}
#ov-skip{position:fixed;bottom:28px;right:20px;padding:9px 18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:rgba(255,255,255,.5);font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.08em;cursor:pointer;z-index:101;transition:all .2s}
#ov-skip:hover{background:rgba(255,255,255,.13);color:#fff}
.ov-phase-shuffle .ov-flag{font-size:5rem;animation:flagSpin .13s ease infinite}
.ov-phase-shuffle .ov-name-big{font-family:'Oswald',sans-serif;font-size:1.6rem;color:#fff;font-weight:700;min-height:32px}
.ov-phase-shuffle .ov-label{font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.35em;color:#00e676;opacity:.8}
.ov-phase-name{animation:ovIn .4s ease}
.ov-phase-name .ov-counter{font-family:'Oswald',sans-serif;font-size:.65rem;letter-spacing:.3em;color:rgba(255,255,255,.35);margin-bottom:8px}
.ov-phase-name .ov-spotlight{font-family:'Oswald',sans-serif;font-size:2.4rem;font-weight:700;color:#fff;letter-spacing:.04em;text-shadow:0 0 40px rgba(0,230,118,.5);animation:namePulse 1s ease}
.ov-phase-name .ov-sub{font-family:'Oswald',sans-serif;font-size:.75rem;letter-spacing:.2em;color:#00e676;opacity:.8;margin-top:4px}
.ov-phase-team{animation:ovIn .3s ease}
.ov-phase-team .ov-for{font-family:'Oswald',sans-serif;font-size:.65rem;letter-spacing:.15em;color:rgba(255,255,255,.38);margin-bottom:12px}
.ov-team-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:8px;animation:cardFlip .35s ease;width:100%}
.ov-team-card .ov-flag-big{font-size:4.5rem;line-height:1;filter:drop-shadow(0 0 18px rgba(255,255,255,.22))}
.ov-team-card .ov-cname{font-family:'Oswald',sans-serif;font-size:1.8rem;color:#fff;font-weight:700}
.ov-team-card .ov-cgroup{font-size:.72rem;color:rgba(255,255,255,.38);font-family:'Oswald',sans-serif;letter-spacing:.15em}
.ov-team-card .ov-tctr{font-size:.7rem;color:#00e676;font-family:'Oswald',sans-serif;letter-spacing:.1em;margin-top:2px}
.ov-phase-summary{animation:ovIn .3s ease}
.ov-phase-summary .ov-sname{font-family:'Oswald',sans-serif;font-size:1.3rem;color:#00e676;font-weight:600;margin-bottom:12px}
.ov-summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.ov-summary-team{display:flex;align-items:center;gap:7px;padding:8px 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:8px;font-size:.85rem;color:#fff}
.ov-phase-complete .ov-done{font-family:'Oswald',sans-serif;font-size:2.2rem;color:#00e676;font-weight:700;animation:namePulse 1s ease}
.ov-phase-complete .ov-done-sub{font-size:.8rem;color:rgba(255,255,255,.45);font-family:'Oswald',sans-serif;letter-spacing:.15em}
.ov-dots{display:flex;gap:6px;margin-top:8px}
.ov-dots span{width:7px;height:7px;border-radius:50%;background:#00e676}
.ov-dots span:nth-child(1){animation:bounce 1s ease infinite}
.ov-dots span:nth-child(2){animation:bounce 1s ease infinite .15s}
.ov-dots span:nth-child(3){animation:bounce 1s ease infinite .3s}
/* ── MISC COMPONENTS ─────────────────────────────────── */
.q-badge{font-size:.58rem;padding:1px 5px;border-radius:3px;font-family:'Oswald',sans-serif;font-weight:600;border:1px solid transparent;flex-shrink:0}
.fb{padding:3px 8px;border-radius:5px;background:transparent;border:1px solid var(--b);color:var(--txm);font-family:'Oswald',sans-serif;font-size:.65rem;cursor:pointer;transition:all .15s}
.fb.on{background:rgba(0,128,42,.1);border-color:var(--gr);color:var(--gr)}
html.dark .fb.on{background:rgba(0,230,118,.1)}

const NMAP={'Czech Republic':'Czechia','Ivory Coast':"Côte d'Ivoire","Cote d'Ivoire":"Côte d'Ivoire",'Bosnia and Herzegovina':'Bosnia & Herz.','Bosnia & Herzegovina':'Bosnia & Herz.','Korea Republic':'South Korea','Republic of Korea':'South Korea','Cape Verde':'Cabo Verde','Congo DR':'DR Congo','Congo, DR':'DR Congo','Democratic Republic of Congo':'DR Congo','United States':'USA','Curacao':'Curaçao','United States of America':'USA'};
function normTeam(n){return NMAP[n]||n;}
function findGFId(h,a){const hn=normTeam(h),an=normTeam(a);return Object.keys(GF).find(id=>(GF[id].home===hn&&GF[id].away===an)||(GF[id].home===an&&GF[id].away===hn));}
function findKOId(h,a,res){const hn=normTeam(h),an=normTeam(a);return Object.keys(BRACKET).find(id=>{const rv=res[id];return rv&&((rv.teamA===hn&&rv.teamB===an)||(rv.teamA===an&&rv.teamB===hn));});}

// ── STORAGE (Firebase primary, localStorage fallback) ─────────────────────────
const useWS = typeof window !== 'undefined' && window.storage; // Claude artifact storage
async function sGet(k){
  try{if(useWS){const r=await window.storage.get(k,true);return r?JSON.parse(r.value):null;}
  return JSON.parse(localStorage.getItem(k));}catch{return null;}
}
async function sSave(k,v){
  try{if(useWS){await window.storage.set(k,JSON.stringify(v),true);return;}
  localStorage.setItem(k,JSON.stringify(v));}catch{}
}
async function sDel(k){
  try{if(useWS){await window.storage.delete(k,true);return;}
  localStorage.removeItem(k);}catch{}
}
// Firebase targeted saves (used alongside local state updates for instant UI)
async function fbSave(path,val){if(DB)DB.ref(path).set(val);else sSave('wc26h:'+path.replace(/\//g,':'),val);}
async function fbDel(path){if(DB)DB.ref(path).remove();else sDel('wc26h:'+path.replace(/\//g,':'));}

// ── AUTO-RESULTS ──────────────────────────────────────────────────────────────
let pollTimer=null;
async function pollResults(){
  if(!CONFIG.footballApiKey||CONFIG.footballApiKey==='PASTE_FOOTBALL_API_KEY')return;
  if(!state.draw)return; // no draw yet, nothing to update
  try{
    const res=await fetch('https://api.football-data.org/v4/competitions/WC/matches?status=FINISHED',{headers:{'X-Auth-Token':CONFIG.footballApiKey}});
    if(!res.ok)return;const data=await res.json();
    const bkRes=resolveBracket();const found=[];
    (data.matches||[]).forEach(m=>{
      const hg=m.score.fullTime.home,ag=m.score.fullTime.away;if(hg==null)return;
      const hn=normTeam(m.homeTeam.name),an=normTeam(m.awayTeam.name);
      const gid=findGFId(hn,an);
      if(gid&&!state.grR[gid]?.played){found.push({type:'group',id:gid,hg,ag});return;}
      const kid=findKOId(hn,an,bkRes);
      if(kid&&!state.koR[kid]?.played){const w=m.score.winner==='HOME_TEAM'?hn:m.score.winner==='AWAY_TEAM'?an:null;if(w)found.push({type:'ko',id:kid,hg,ag,winner:w,home:hn,away:an});}
    });
    if(!found.length)return;
    if(adminSess){
      // Admin is signed in — auto-import silently and notify
      await _autoImport(found);
    } else {
      // Queue for when admin next signs in
      pendingImports=found;
    }
  }catch(e){console.warn('Auto-results poll failed:',e);}
}
async function _autoImport(results){
  let count=0;
  for(const r of results){
    if(r.type==='group'){state.grR[r.id]={hg:r.hg,ag:r.ag,played:true};count++;recentResults.unshift({home:GF[r.id].home,away:GF[r.id].away,hg:r.hg,ag:r.ag});notifyTeams(r.id,r.hg,r.ag);}
    else{state.koR[r.id]={home:r.home,away:r.away,hg:r.hg,ag:r.ag,winner:r.winner,played:true,round:BRACKET[r.id].r};count++;}
  }
  await fbSave('wc2026/gr',state.grR);
  await fbSave('wc2026/ko',state.koR);
  if(state.koR['m104']?.played){fireConfetti();try{SFX.fanfare();}catch{}}
  render();
  if(count)showToast(`⚡ ${count} result${count>1?'s':''} auto-imported`,'gold');
}
function updateResultsBanner(){
  const b=document.getElementById('res-banner');if(!b)return;
  if(!pendingImports.length||!isAdmin()){b.style.display='none';return;}
  b.style.display='flex';b.style.alignItems='center';b.style.justifyContent='space-between';b.style.gap='10px';
  b.innerHTML=`<span style="font-family:'Oswald',sans-serif;font-size:.82rem;color:var(--gr)">⚡ ${pendingImports.length} new result${pendingImports.length>1?'s':''} found</span><div style="display:flex;gap:6px"><button class="btn btn-green" style="padding:5px 12px;font-size:.7rem" onclick="importAll()">IMPORT ALL</button><button class="btn-sm" onclick="pendingImports=[];updateResultsBanner()">Dismiss</button></div>`;
}
async function importAll(){
  if(!adminSess){showToast('Admin sign-in required','error');return;}
  await _autoImport(pendingImports);
  pendingImports=[];updateResultsBanner();
}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(pollResults,3*60*1000);setTimeout(pollResults,2000);}

// ── TEAMS WEBHOOK ─────────────────────────────────────────────────────────────
async function notifyTeams(matchId,hg,ag){
  if(!CONFIG.teamsWebhook)return;
  const f=GF[matchId];if(!f)return;
  const lb=calcLeaderboard();
  const affected=lb.filter(p=>p.teams.some(t=>t.name===f.home||t.name===f.away)).map(p=>{const t=p.teams.find(t=>t.name===f.home||t.name===f.away);const bd=p.breakdown.find(b=>b.name===t.name);return{name:p.name,team:t.name,flag:t.flag,pts:bd?.pts||0};});
  const hw=hg>ag,aw=ag>hg;
  const card={"@type":"MessageCard","@context":"http://schema.org/extensions","themeColor":hw||aw?"00e676":"f59e0b","summary":`${f.home} ${hg}-${ag} ${f.away}`,"sections":[{"activityTitle":`⚽ **${f.home} ${hg} – ${ag} ${f.away}**`,"activitySubtitle":`Group ${f.group} · Matchday ${f.matchday} · ${hw?f.home+' WIN':aw?f.away+' WIN':'DRAW'}`,"facts":affected.map(a=>({name:a.flag+' '+a.team,value:a.name+' — '+a.pts+'pts'}))},{"text":`[📊 View Standings](${location.href})`}]};
  fetch(CONFIG.teamsWebhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(card)}).catch(()=>{});
}

// ── AUDIO ─────────────────────────────────────────────────────────────────────
const SFX={_c:null,ctx(){if(state.muted)return null;if(!this._c){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;this._c=new AC();}return this._c;},
  drumroll(){const c=this.ctx();if(!c)return;const buf=c.createBuffer(1,c.sampleRate*2.2,c.sampleRate);const d=buf.getChannelData(0);for(let i=0;i<buf.length;i++)d[i]=(Math.random()*2-1)*0.3;const src=c.createBufferSource();src.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;const g=c.createGain();g.gain.setValueAtTime(0.1,c.currentTime);g.gain.linearRampToValueAtTime(0.5,c.currentTime+2);src.connect(f);f.connect(g);g.connect(c.destination);src.start();src.stop(c.currentTime+2.2);},
  ding(){const c=this.ctx();if(!c)return;const o=c.createOscillator();const g=c.createGain();o.type='sine';o.frequency.value=1047;g.gain.setValueAtTime(0,c.currentTime);g.gain.linearRampToValueAtTime(0.4,c.currentTime+0.02);g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.7);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+0.75);},
  fanfare(){const c=this.ctx();if(!c)return;[262,330,392,523,659,784].forEach((f,i)=>{const o=c.createOscillator();const g=c.createGain();o.type=i<3?'square':'triangle';o.frequency.value=f;const t=c.currentTime+i*.11;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.22,t+.04);g.gain.exponentialRampToValueAtTime(.001,t+.45);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.5);});},
  goal(){const c=this.ctx();if(!c)return;[110,130,155,110,130,155].forEach((f,i)=>{const o=c.createOscillator();const g=c.createGain();o.type='sawtooth';o.frequency.value=f;const t=c.currentTime+i*.08;g.gain.setValueAtTime(.4,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+.4);});},
  save(){const c=this.ctx();if(!c)return;const o=c.createOscillator();const g=c.createGain();o.type='sine';o.frequency.setValueAtTime(440,c.currentTime);o.frequency.exponentialRampToValueAtTime(880,c.currentTime+.1);g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.28);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.32);}
};

// ── CONFETTI ──────────────────────────────────────────────────────────────────
function fireConfetti(){
  const cv=document.getElementById('confetti');const ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';
  const cols=['#00e676','#ffd700','#3b82f6','#ef4444','#8b5cf6','#f59e0b','#06b6d4'];
  const ps=Array.from({length:180},()=>({x:Math.random()*cv.width,y:-10-Math.random()*60,vx:(Math.random()-.5)*5,vy:Math.random()*4+2,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*10+4,h:Math.random()*5+3,r:Math.random()*360,vr:(Math.random()-.5)*6}));
  let af;function anim(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.05;if(p.y<cv.height+20)alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.col;ctx.globalAlpha=Math.max(0,1-(p.y/cv.height));ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)af=requestAnimationFrame(anim);else{cv.style.display='none';}}
  af=requestAnimationFrame(anim);setTimeout(()=>{cancelAnimationFrame(af);cv.style.display='none';},5000);
}

// ── DRAW CEREMONY ─────────────────────────────────────────────────────────────
let drawSkip=false,drawCycleInterval=null;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
async function skipableDelay(ms){
  const step=80,start=Date.now();
  while(Date.now()-start<ms){if(drawSkip)return;await delay(step);}
}
function skipDraw(){drawSkip=true;}
function setOv(html){document.getElementById('ov-inner').innerHTML=html;}
function showOv(){document.getElementById('ov').style.display='flex';}
function hideOv(){document.getElementById('ov').style.display='none';drawSkip=false;}

async function runDraw(){
  const valid=state.names.slice(0,state.pc).map(n=>n.trim()).filter(Boolean);
  if(valid.length<2){showToast('Need at least 2 players','error');return;}
  if(!adminSess&&!DB){} // local mode allow
  else if(!adminSess&&state.draw){showToast('Admin sign-in required','error');return;}
  const go=async vn=>{
    drawSkip=false;
    // Compute draw immediately
    const sh=cryptoShuffle(ALL_TEAMS);const n=vn.length,base=Math.floor(48/n),rem=48%n;
    const ex=new Set(cryptoShuffle(Array.from({length:n},(_,i)=>i)).slice(0,rem));
    let ti=0;const parts=vn.map((name,i)=>{const cnt=base+(ex.has(i)?1:0);const teams=sh.slice(ti,ti+cnt);ti+=cnt;return{name,teams};});
    // Phase 1 – Shuffle
    showOv();drawCycleInterval=setInterval(()=>{
      const t=ALL_TEAMS[Math.floor(Date.now()/70)%ALL_TEAMS.length];
      setOv(`<div class="ov-phase-shuffle"><div class="ov-label">SHUFFLING 48 TEAMS</div><div class="ov-flag" style="font-size:5rem;animation:flagSpin .13s ease infinite;margin:10px 0;filter:drop-shadow(0 0 16px rgba(255,255,255,.3))">${t.flag}</div><div class="ov-name-big">${t.name}</div><div class="ov-dots"><span></span><span></span><span></span></div></div>`);
    },70);
    try{SFX.drumroll();}catch{}
    await skipableDelay(2300);
    clearInterval(drawCycleInterval);
    // Phase 2 – Sequential reveals
    if(!drawSkip){
      for(const[idx,p] of parts.entries()){
        if(drawSkip)break;
        // Name spotlight
        setOv(`<div class="ov-phase-name"><div class="ov-counter">PLAYER ${idx+1} OF ${n}</div><div class="ov-spotlight">${p.name.toUpperCase()}</div><div class="ov-sub">IS UP…</div></div>`);
        try{SFX.ding();}catch{}
        await skipableDelay(1200);
        // Team reveals
        for(const[ti,team] of p.teams.entries()){
          if(drawSkip)break;
          setOv(`<div class="ov-phase-team"><div class="ov-for">For: ${p.name}</div><div class="ov-team-card"><div class="ov-flag-big">${team.flag}</div><div class="ov-cname">${team.name}</div><div class="ov-cgroup">GROUP ${team.group}</div><div class="ov-tctr">Team ${ti+1} of ${p.teams.length}</div></div></div>`);
          try{SFX.ding();}catch{}
          await skipableDelay(850);
        }
        if(drawSkip)break;
        // Summary
        setOv(`<div class="ov-phase-summary"><div class="ov-sname">✓ ${p.name}</div><div class="ov-summary-grid">${p.teams.map(t=>`<div class="ov-summary-team"><span style="font-size:1.2rem">${t.flag}</span>${t.name}</div>`).join('')}</div></div>`);
        await skipableDelay(1000);
      }
    }
    // Phase 3 – Complete
    setOv(`<div class="ov-phase-complete"><div style="font-size:2.8rem;margin-bottom:8px">🏆</div><div class="ov-done">DRAW COMPLETE!</div><div class="ov-done-sub" style="margin-top:6px">${n} PLAYERS · ${base}${rem?'–'+(base+1):''} TEAMS EACH</div></div>`);
    try{SFX.fanfare();}catch{}
    fireConfetti();
    await delay(1800);
    // Save
    const data={participants:parts,drawnAt:new Date().toISOString(),participantCount:n};
    await fbSave('wc2026/draw',data);await fbDel('wc2026/gr');await fbDel('wc2026/ko');
    state.draw=data;state.grR={};state.koR={};Object.keys(tempS).forEach(k=>delete tempS[k]);editing.clear();recentResults=[];manualMap={};
    hideOv();state.tab='draw';render();
    showToast(`Draw complete — ${n} players!`,'gold');
  };
  if(valid.length!==state.pc){showMod('Empty slots',`${state.pc} slots, ${valid.length} named. Continue with ${valid.length}?`,'CONTINUE',()=>go(valid));}
  else go(valid);
}
function cryptoShuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

// ── LIVE MATCH DETECTION ─────────────────────────────────────────────────────
function isLiveNow(id){
  // Returns true if this fixture is likely in progress based on BST time
  const f=GF[id];if(!f||state.grR[id]?.played)return false;
  try{
    const now=new Date();
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const[day,mon]=f.dt.split(' ');const[h,m]=f.tm.replace('✝','').split(':');
    const ko=new Date(2026,months[mon],parseInt(day),parseInt(h),parseInt(m));
    const diff=(now-ko)/60000;// minutes since KO
    return diff>=0&&diff<=105;// 0–105 mins (90 + 15 extra time buffer)
  }catch{return false;}
}

// ── CALCULATIONS ──────────────────────────────────────────────────────────────
function groupTable(g){
  const s={};GD[g].forEach(t=>{s[t.n]={name:t.n,flag:t.f,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});
  let played=0;
  GF_IDS[g].forEach(id=>{const r=state.grR[id];if(!r?.played)return;played++;const{hg,ag}=r,f=GF[id];s[f.home].P++;s[f.away].P++;s[f.home].GF+=hg;s[f.home].GA+=ag;s[f.home].GD+=hg-ag;s[f.away].GF+=ag;s[f.away].GA+=hg;s[f.away].GD+=ag-hg;if(hg>ag){s[f.home].W++;s[f.home].Pts+=3;s[f.away].L++;}else if(hg<ag){s[f.away].W++;s[f.away].Pts+=3;s[f.home].L++;}else{s[f.home].D++;s[f.away].D++;s[f.home].Pts++;s[f.away].Pts++;}});
  return{complete:played===6,played,rows:Object.values(s).sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name))};
}
function computeQual(){
  const tables={};let allDone=true;
  Object.keys(GD).forEach(g=>{tables[g]=groupTable(g);if(!tables[g].complete)allDone=false;});
  const q={};const thirds=[];
  Object.entries(tables).forEach(([g,{complete,rows}])=>{if(complete){q[rows[0].name]='top2';q[rows[1].name]='top2';thirds.push({...rows[2],group:g});q[rows[2].name]='maybe3rd';q[rows[3].name]='eliminated';}else rows.forEach(r=>{if(!q[r.name])q[r.name]='pending';});});
  if(allDone){thirds.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF);thirds.forEach((t,i)=>{q[t.name]=i<8?'best3rd':'eliminated';});}
  return{qual:q,thirds,tables};
}
function resolveSlot(sl,tables,thirds){
  if(sl.t==='winner')return tables[sl.g]?.complete?tables[sl.g].rows[0].name:null;
  if(sl.t==='runnerup')return tables[sl.g]?.complete?tables[sl.g].rows[1].name:null;
  if(sl.t==='best3rd'){const q8=thirds.slice(0,8).map(t=>t.name);return thirds.find(t=>sl.gs.includes(t.group)&&q8.includes(t.name))?.name||null;}
  if(sl.t==='prev'){const m=state.koR[sl.m];return m?.played?m.winner:null;}
  if(sl.t==='loser'){const m=state.koR[sl.m];if(!m?.played)return null;return m.home===m.winner?m.away:m.home;}
  return null;
}
function resolveBracket(){const{tables,thirds}=computeQual();const res={};Object.keys(BRACKET).forEach(id=>{const b=BRACKET[id];res[id]={teamA:resolveSlot(b.sA,tables,thirds),teamB:resolveSlot(b.sB,tables,thirds)};});return res;}
function slotDesc(sl){if(sl.t==='winner')return`Winner Grp ${sl.g}`;if(sl.t==='runnerup')return`Runner-up Grp ${sl.g}`;if(sl.t==='best3rd')return`Best 3rd`;if(sl.t==='prev')return`W ${BRACKET[sl.m]?.l||sl.m}`;if(sl.t==='loser')return`L ${BRACKET[sl.m]?.l||sl.m}`;return'TBD';}
function calcLeaderboard(){
  if(!state.draw)return[];
  const{qual}=computeQual();const koArr=Object.values(state.koR).filter(m=>m.played);
  return state.draw.participants.map(p=>{
    let total=0;const breakdown=p.teams.map(team=>{
      let pts=0;const items=[];let gW=0,gD=0,gL=0,goals=0;
      Object.entries(GF).filter(([_,f])=>f.home===team.name||f.away===team.name).forEach(([id,f])=>{const r=state.grR[id];if(!r?.played)return;const isH=f.home===team.name,tf=isH?r.hg:r.ag,ta=isH?r.ag:r.hg;goals+=tf;if(tf>ta)gW++;else if(tf===ta)gD++;else gL++;});
      if(gW){pts+=gW*state.scoring.group_win;items.push(`${gW}W +${gW*state.scoring.group_win}`);}
      if(gD){pts+=gD*state.scoring.group_draw;items.push(`${gD}D +${gD*state.scoring.group_draw}`);}
      if(gL)items.push(`${gL}L`);
      if(state.scoring.goal_bonus>0&&goals>0){pts+=goals*state.scoring.goal_bonus;items.push(`${goals}⚽ +${+(goals*state.scoring.goal_bonus).toFixed(1)}`);}
      const qv=qual[team.name]||'pending';
      if(qv==='top2'){pts+=state.scoring.qualify_top2;items.push(`Qual +${state.scoring.qualify_top2}`);}
      else if(qv==='best3rd'){pts+=state.scoring.qualify_3rd;items.push(`Best 3rd +${state.scoring.qualify_3rd}`);}
      koArr.filter(m=>m.winner===team.name).forEach(m=>{const p2=state.scoring[`win_${m.round}`]||0;pts+=p2;items.push(`${KO_LABEL[m.round]} win +${p2}`);});
      total+=pts;
      return{name:team.name,flag:team.flag,group:team.group,pts:Math.round(pts*10)/10,items,qual:qv};
    });
    return{...p,total:Math.round(total*10)/10,breakdown};
  }).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
}

  // If draw exists and not signed in, show read-only locked view
  if(state.draw&&!adminSess){
    const lb=calcLeaderboard();
    return`<div style="text-align:center;padding:32px 16px">
      <div style="font-size:3rem;margin-bottom:12px">🔒</div>
      <div style="font-family:'Oswald',sans-serif;font-size:1.1rem;color:var(--tx);font-weight:700;margin-bottom:8px">READ-ONLY MODE</div>
      <p style="font-size:.85rem;color:var(--txd);line-height:1.7;margin-bottom:24px;max-width:340px;margin-left:auto;margin-right:auto">
        The draw is locked. Everyone can view standings, fixtures, tables and the bracket.<br><br>
        Tap the <b style="color:var(--gr)">⚽</b> in the header 7 times to sign in as admin and enter results.
      </p>
      <button class="btn btn-green" onclick="_li()" style="padding:11px 28px;font-size:.82rem">Sign In as Admin</button>
      ${lb.length?`<div style="margin-top:32px;text-align:left">
        <div style="font-family:'Oswald',sans-serif;font-size:.7rem;color:var(--txm);letter-spacing:.1em;margin-bottom:10px;text-align:center">CURRENT STANDINGS</div>
        ${lb.slice(0,3).map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--card);border:1px solid var(--b);border-radius:9px;margin-bottom:7px;box-shadow:var(--shadow)">
          <span style="font-size:1.3rem">${['🥇','🥈','🥉'][i]}</span>
          <span style="font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;flex:1">${p.name}</span>
          <span style="font-family:'Oswald',sans-serif;font-size:1rem;font-weight:700;color:${i===0?'var(--gold)':'var(--gr)'}">${p.total} pts</span>
        </div>`).join('')}
      </div>`:''}
    </div>`;
  }
  const names=state.names,pc=state.pc,pot=state.prize.on?pc*state.prize.buyin:0;
  const eq=48%pc===0;
  return`<h2 class="ttl">${state.draw?'Admin Setup':'Setup'}</h2><p class="sub">${state.draw?'Manage the draw, scoring and settings. Sign out when done to return to read-only mode.':'Add players, set scoring, then run the draw.'}</p>
  <div class="card" style="padding:12px 14px;margin-bottom:11px">
    <div style="font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.1em;color:var(--txd);margin-bottom:8px">NUMBER OF PLAYERS</div>
    <div style="display:flex;align-items:center;gap:7px;flex-wrap:wrap">
      <button class="adj" onclick="setPC(state.pc-1)">−</button>
      <span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:1.1rem;color:var(--tx);min-width:24px;text-align:center">${pc}</span>
      <button class="adj" onclick="setPC(state.pc+1)">+</button>
      ${[8,10,12,16].map(n=>`<button class="fb${pc===n?' on':''}" onclick="setPC(${n})">${n}</button>`).join('')}
      <span style="font-size:.73rem;color:${eq?'var(--gr)':'var(--amber)'}">${eq?`${pc}×${48/pc}=48 ✓`:`${pc-48%pc}×${Math.floor(48/pc)}+${48%pc}×${Math.floor(48/pc)+1}=48`}</span>
    </div>
  </div>
  <div style="margin-bottom:11px">
    <div style="font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.1em;color:var(--txd);margin-bottom:7px">PARTICIPANTS</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:7px">
      ${Array(pc).fill(null).map((_,i)=>`<div style="position:relative"><span style="position:absolute;left:9px;top:50%;transform:translateY(-50%);font-family:'Oswald',sans-serif;font-size:.63rem;color:var(--txm);font-weight:700;pointer-events:none">${String(i+1).padStart(2,'0')}</span><input style="width:100%;padding:8px 8px 8px 30px;background:var(--card);border:1px solid ${(names[i]||'').trim()?'var(--bb)':'var(--b)'};border-radius:6px;color:var(--tx);font-size:.85rem;transition:border-color .2s" type="text" value="${(names[i]||'').replace(/"/g,'&quot;')}" placeholder="Player ${i+1}" oninput="state.names[${i}]=this.value;saveSetup()"/></div>`).join('')}
    </div>
  </div>
  <!-- Prize + Scoring collapsibles -->
  ${['prize','scoring'].map(key=>{
    const open=state.sOpen[key];
    const inner=key==='prize'?`
      <label style="display:flex;align-items:center;gap:8px;margin:9px 0;cursor:pointer"><input type="checkbox" ${state.prize.on?'checked':''} onchange="state.prize.on=this.checked;saveSetup();render()" style="width:15px;height:15px;accent-color:var(--gr);cursor:pointer"/><span style="font-size:.83rem">Enable prize pot</span></label>
      ${state.prize.on?`<div style="display:flex;align-items:center;gap:7px;margin-bottom:9px"><span style="font-size:.78rem;color:var(--txd);min-width:55px">Buy-in</span><span style="color:var(--txm)">£</span><input type="number" min="0" max="1000" value="${state.prize.buyin}" oninput="state.prize.buyin=Math.max(0,parseInt(this.value)||0);saveSetup()" style="width:64px;padding:4px 7px;background:var(--inp);border:1px solid var(--b);border-radius:5px;color:var(--tx);font-size:.83rem"/><span style="font-size:.72rem;color:var(--txm)">= <b style="color:var(--gold)">£${pot}</b></span></div>
      <div style="display:flex;gap:5px;margin-bottom:6px">${['1st','2nd','3rd'].map((l,i)=>`<div style="flex:1"><div style="font-size:.63rem;color:var(--txm);font-family:'Oswald',sans-serif;margin-bottom:2px">${l}%</div><input type="number" min="0" max="100" value="${state.prize.pay[i]}" oninput="state.prize.pay[${i}]=Math.max(0,Math.min(100,parseInt(this.value)||0));saveSetup()" style="width:100%;padding:4px 7px;background:var(--inp);border:1px solid var(--b);border-radius:5px;color:var(--tx);font-size:.83rem"/></div>`).join('')}</div>
      <div style="font-size:.72rem;color:${state.prize.pay.reduce((s,p)=>s+p,0)===100?'var(--gr)':'var(--amber)'}">${state.prize.pay.reduce((s,p)=>s+p,0)}% total ${state.prize.pay.reduce((s,p)=>s+p,0)===100?'✓':'⚠'}</div>`:''}`:
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:5px;margin-top:9px">${Object.entries(SCR_LBL).map(([k,l])=>`<div style="display:flex;align-items:center;gap:7px;padding:4px 7px;background:var(--cardh);border-radius:5px"><span style="flex:1;font-size:.76rem;color:var(--tx)">${l}</span><input type="number" min="0" max="99" step="${k==='goal_bonus'?.1:1}" value="${state.scoring[k]}" oninput="state.scoring['${k}']=Math.max(0,parseFloat(this.value)||0);saveSetup()" style="width:50px;padding:3px 6px;background:var(--inp);border:1px solid var(--b);border-radius:4px;color:var(--gr);font-family:'Oswald',sans-serif;font-weight:700;font-size:.82rem;text-align:center"/></div>`).join('')}</div>
    <button class="btn-sm" style="margin-top:9px" onclick="state.scoring={...DEF_SCR};saveSetup();render()">RESET TO DEFAULT</button>`;
    const title=key==='prize'?`💰 PRIZE POT${state.prize.on?` · <b style="color:var(--gold)">£${pot}</b>`:''}`:key==='scoring'?'🎯 SCORING':'';
    return`<div class="card" style="margin-bottom:10px;overflow:hidden"><button style="width:100%;padding:10px 13px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--tx);font-family:'Oswald',sans-serif;font-size:.76rem;letter-spacing:.05em;text-align:left" onclick="state.sOpen['${key}']=!state.sOpen['${key}'];render()"><span>${title}</span><span style="color:var(--txm)">${open?'▲':'▼'}</span></button>${open?`<div style="padding:4px 13px 13px;border-top:1px solid var(--b)">${inner}</div>`:''}</div>`;
  }).join('')}
  <!-- Manual Assignment -->
  <div class="card" style="margin-bottom:16px;overflow:hidden">
    <button style="width:100%;padding:10px 13px;background:none;border:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;color:var(--tx);font-family:'Oswald',sans-serif;font-size:.76rem;letter-spacing:.05em;text-align:left" onclick="state.sOpen.manual=!state.sOpen.manual;render()">
      <span>🔧 MANUAL DRAW OVERRIDE <span style="font-size:.64rem;color:var(--txm);font-family:'Barlow',sans-serif;font-weight:400;letter-spacing:0"> — restore a lost draw manually</span></span>
      <span style="color:var(--txm)">${state.sOpen.manual?'▲':'▼'}</span>
    </button>
    ${state.sOpen.manual?`<div style="padding:4px 13px 13px;border-top:1px solid var(--b)">
      <p style="font-size:.8rem;color:var(--txd);margin:9px 0 12px;line-height:1.55">Select a participant, then click teams from the unassigned pool to assign them. Click a team in their list to remove it. When done click <strong>Apply as Draw</strong>.</p>
      <div id="manual-panel"></div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--b)">
        <div style="font-family:'Oswald',sans-serif;font-size:.68rem;color:var(--txd);letter-spacing:.1em;margin-bottom:8px">RESTORE FROM BACKUP</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${state.draw?`<button class="btn btn-ghost" onclick="exportDraw()" style="font-size:.72rem">📤 EXPORT / BACKUP DRAW</button>`:''}
          <button class="btn btn-ghost" onclick="showImportDraw()" style="font-size:.72rem">📥 IMPORT FROM BACKUP</button>
        </div>
      </div>
    </div>`:''}
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <button class="btn-draw" onclick="protectedRunDraw()">🎲 RUN THE DRAW</button>
    ${state.draw?`<button class="btn btn-ghost" onclick="protectedReset()">RESET ALL</button>`:''}
    <span style="font-size:.75rem;color:var(--txm);margin-left:auto">${names.slice(0,pc).filter(x=>x.trim()).length}/${pc} named</span>
  </div>`;
}

function renderDraw(){
  const lb=calcLeaderboard();const{qual}=computeQual();
  return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div><h2 class="ttl">The Draw${state.draw?.manual?' <span style="font-size:.7rem;color:var(--txm);font-weight:400">(Manual)</span>':''}</h2>
    <div style="font-size:.7rem;color:var(--txm)">${new Date(state.draw.drawnAt).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</div></div>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="copyDraw()" style="font-size:.7rem">📋 COPY</button>
      <button class="btn btn-ghost" onclick="shareURL()" style="font-size:.7rem">🔗 SHARE</button>
      ${isAdmin()?`<button class="btn btn-ghost" onclick="exportDraw()" style="font-size:.7rem">💾 BACKUP</button><button class="btn btn-ghost" onclick="setTab('setup')" style="font-size:.7rem">✏ EDIT</button>`:''}
    </div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px">
  ${lb.map((p,idx)=>{
    const isF=idx===0&&p.total>0;
    return`<div class="dc${isF?' gold':''}" style="animation-delay:${idx*.04}s">
      <div class="dc-hdr">
        <div style="width:22px;height:22px;border-radius:50%;background:${isF?'linear-gradient(135deg,var(--gold),var(--gold-dim))':'var(--b)'};display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:.63rem;font-weight:700;color:${isF?'#fff':'var(--txd)'};flex-shrink:0">${idx+1}</div>
        <span style="font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:600;color:var(--tx);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}</span>
        <span style="font-family:'Oswald',sans-serif;font-size:.92rem;font-weight:700;color:${isF?'var(--gold)':p.total>0?'var(--gr)':'var(--txm)'}">${p.total}<span style="font-size:.56rem;color:var(--txm);margin-left:2px">pts</span></span>
      </div>
      ${p.breakdown.map(t=>{const q=t.qual||'pending';return`<div class="team-row${q==='eliminated'?' elim':''}">
        <span style="font-size:1rem">${t.flag}</span>
        <span style="font-size:.82rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${q==='eliminated'?'var(--txm)':'var(--tx)'};font-weight:500;${q==='eliminated'?'text-decoration:line-through':''}">${t.name}</span>
        ${t.pts>0?`<span style="font-family:'Oswald',sans-serif;font-size:.68rem;font-weight:700;color:var(--gr)">+${t.pts}</span>`:''}
        ${qBadge(q)}
      </div>`;}).join('')}
    </div>`;
  }).join('')}</div>`;
}

function renderFixtures(){
  const{qual}=computeQual();
  const vis=Object.entries(GF).filter(([_,f])=>(state.fG==='ALL'||f.group===state.fG)&&(state.fMD==='ALL'||String(f.matchday)===state.fMD));
  const played=vis.filter(([id])=>state.grR[id]?.played).length;
  const feed=recentResults.slice(0,5);
  return`<div style="display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid var(--b)">
    ${[['group','⚽ Group Stage'],['tables','📊 Tables']].map(([id,l])=>`<button onclick="state.fTab='${id}';render()" style="padding:8px 13px;font-size:.72rem;background:none;border:none;border-bottom:2px solid ${state.fTab===id?'var(--gr)':'transparent'};color:${state.fTab===id?'var(--gr)':'var(--txm)'};cursor:pointer;white-space:nowrap;font-family:'Oswald',sans-serif;letter-spacing:.06em">${l}</button>`).join('')}
  </div>
  ${state.fTab==='group'?`
  ${feed.length?`<div style="margin-bottom:14px"><div style="font-family:'Oswald',sans-serif;font-size:.68rem;letter-spacing:.1em;color:var(--txm);margin-bottom:6px">RECENT RESULTS</div><div style="display:flex;flex-direction:column;gap:5px">${feed.map(r=>`<div class="feed-item"><span style="font-size:.9rem">${FLAGS[r.home]||'⚽'}</span><span style="flex:1;font-size:.78rem;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.home}</span><span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:.9rem;color:${r.hg===r.ag?'var(--amber)':'var(--gr)'};padding:0 6px">${r.hg}–${r.ag}</span><span style="flex:1;font-size:.78rem;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right">${r.away}</span><span style="font-size:.9rem">${FLAGS[r.away]||'⚽'}</span></div>`).join('')}</div></div>`:''}
  <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:flex-start">
    <div><div style="font-size:.62rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.08em;margin-bottom:4px">GROUP</div><div style="display:flex;gap:3px;flex-wrap:wrap">${['ALL',...Object.keys(GD)].map(g=>`<button class="fb${state.fG===g?' on':''}" onclick="state.fG='${g}';render()">${g}</button>`).join('')}</div></div>
    <div><div style="font-size:.62rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.08em;margin-bottom:4px">MATCHDAY</div><div style="display:flex;gap:3px">${[['ALL','All'],['1','MD1'],['2','MD2'],['3','MD3']].map(([v,l])=>`<button class="fb${state.fMD===v?' on':''}" onclick="state.fMD='${v}';render()">${l}</button>`).join('')}</div></div>
    <span style="font-size:.7rem;color:var(--txm);margin-left:auto;align-self:flex-end">${played}/${vis.length}</span>
  </div>
  <div class="grid">${vis.map(([id])=>renderMC(id)).join('')}</div>`:renderTablesContent(qual)}`;
}

function renderTablesContent(qual){
  return`<div class="grid-wide">${Object.keys(GD).map(g=>{
    const{complete,rows,played}=groupTable(g);
    const dotC=(i)=>i<2?'#007a3d':i===2?'var(--amber)':'#607080';
    return`<div class="gt${complete?' done':''}">
      <div class="gt-hdr"><span class="gt-lbl">GROUP ${g}</span><span style="font-size:.62rem;color:var(--txm)">${played}/6${complete?' · Done':''}</span></div>
      <div class="gt-row" style="padding:3px 9px;border-bottom-width:1px"><span></span><span style="font-size:.56rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.06em">Team</span>${['P','W','D','L','GF','GA','GD','Pts'].map(h=>`<span style="font-size:.55rem;color:var(--txm);font-family:'Oswald',sans-serif;font-weight:600;text-align:center">${h}</span>`).join('')}</div>
      ${rows.map((row,pos)=>{const qv=qual[row.name]||'pending';return`<div class="gt-row${qv==='eliminated'?' elim':''}">
        <div style="display:flex;align-items:center;justify-content:center"><div style="width:5px;height:5px;border-radius:50%;background:${dotC(pos)}"></div></div>
        <div style="display:flex;align-items:center;gap:4px;min-width:0"><span style="font-size:.9rem">${row.flag}</span><span style="font-size:.76rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:${qv==='eliminated'?'var(--txm)':'var(--tx)'}">${row.name}</span>${(qv==='top2'||qv==='best3rd')?`<span style="font-size:.52rem;padding:0 3px;border-radius:2px;background:${QCOL[qv]}18;border:1px solid ${QCOL[qv]}40;color:${QCOL[qv]};font-family:'Oswald',sans-serif;font-weight:600;flex-shrink:0">Q</span>`:''}</div>
        ${[row.P,row.W,row.D,row.L,row.GF,row.GA,(row.GD>0?'+':'')+row.GD,row.Pts].map((v,i)=>`<span class="gt-cell" style="color:${i===4?'var(--gr)':i===5?'var(--red)':i===6?row.GD>0?'var(--gr)':row.GD<0?'var(--red)':'var(--txd)':i===7?'var(--tx)':'var(--txd)'}">${v}</span>`).join('')}
      </div>`;}).join('')}
    </div>`;
  }).join('')}</div>`;
}

function renderTables(){
  const{qual}=computeQual();
  return`<h2 class="ttl">Group Tables</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;font-size:.7rem">${[['#007a3d','Qualified top 2'],['var(--amber)','Possible best 3rd'],['#607080','Eliminated']].map(([c,l])=>`<span style="display:flex;align-items:center;gap:4px"><span style="width:8px;height:8px;border-radius:2px;background:${c};display:inline-block"></span><span style="color:var(--txd)">${l}</span></span>`).join('')}</div>
  ${renderTablesContent(qual)}`;
}

function renderKO(){
  const res=resolveBracket();const champ=state.koR['m104']?.winner;
  const koByRound={};KO_ROUNDS.forEach(r=>{koByRound[r]=[];});Object.entries(BRACKET).filter(([_,b])=>b.r!=='3rd').forEach(([id,b])=>{if(koByRound[b.r])koByRound[b.r].push(id);});
  // Bracket visualization
  const bkCols=[
    {h:'R32',ms:['m73','m75','m74','m77','m76','m78','m79','m80']},
    {h:'R16',ms:['m90','m89','m91','m92']},
    {h:'QF', ms:['m97','m98']},
    {h:'SF', ms:['m101']},
    {h:'FINAL',ms:['m104']},
    {h:'SF', ms:['m102']},
    {h:'QF', ms:['m99','m100']},
    {h:'R16',ms:['m93','m94','m95','m96']},
    {h:'R32',ms:['m81','m82','m83','m84','m85','m86','m87','m88']},
  ];
  function bkSlot(name,isW,isL){const f=name?FLAGS[name]||'⚽':'🔲';return`<div class="bk-slot${isW?' w':isL?' l':''}"><span style="font-size:.9rem;filter:${isL?'grayscale(.7)':'none'}">${f}</span><span class="bn">${name||'TBD'}</span>${isW?`<span style="color:var(--gr);font-size:.72rem">✓</span>`:''}</div>`;}
  const bkHtml=bkCols.map((col,ci)=>{
    const pairs=[];for(let i=0;i<col.ms.length;i+=2)pairs.push(col.ms.slice(i,i+2));
    return`<div class="bk-col">
      <div class="bk-rnd-hdr" style="color:${col.h==='FINAL'?'var(--gold)':'rgba(255,255,255,.3)'}">${col.h}</div>
      ${pairs.map(pair=>{
        const spacerH=col.ms.length<=1?0:col.ms.length<=2?48:col.ms.length<=4?20:4;
        return`<div class="bk-pair">
          ${pair.map((mId,pi)=>{
            const r2=state.koR[mId];const rv=res[mId]||{};const hw=r2?.played&&r2.winner===rv.teamA;const aw=r2?.played&&r2.winner===rv.teamB;
            return`${pi>0?`<div style="height:${spacerH}px"></div>`:''}
            <div class="bk-match${mId==='m104'?' final':''} connector" style="border-color:${r2?.played?KO_COL[BRACKET[mId].r]+'55':'var(--b)'}">
              ${mId==='m104'?`<div style="padding:2px 8px;background:rgba(176,120,0,.12);border-bottom:1px solid rgba(176,120,0,.3);font-family:'Oswald',sans-serif;font-size:.57rem;color:var(--gold);letter-spacing:.1em;text-align:center">🏆 FINAL</div>`:''}
              ${bkSlot(rv.teamA,hw,aw&&r2?.played)}
              <div class="bk-div"></div>
              ${bkSlot(rv.teamB,aw,hw&&r2?.played)}
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  return`<h2 class="ttl">Knockout Stage</h2>
  <p style="font-size:.75rem;color:var(--txm);margin-bottom:16px">Teams auto-fill from group results. Enter scores to advance winners.</p>
  ${champ?`<div style="margin-bottom:16px;padding:9px 14px;background:linear-gradient(90deg,rgba(176,120,0,.1),transparent);border:1px solid rgba(176,120,0,.35);border-radius:8px;display:flex;align-items:center;gap:8px"><span style="color:var(--gold);font-family:'Oswald',sans-serif;letter-spacing:.05em">🏆 WORLD CHAMPIONS:</span><span style="font-size:1rem">${FLAGS[champ]}</span><span style="color:var(--tx);font-weight:600">${champ}</span></div>`:''}
  <div class="card" style="padding:12px 8px 12px;margin-bottom:22px;overflow:hidden">
    <div style="font-family:'Oswald',sans-serif;font-size:.66rem;letter-spacing:.1em;color:var(--txd);margin-bottom:9px;padding-left:6px">TOURNAMENT BRACKET</div>
    <div class="bk-wrap"><div class="bk-inner" id="bk-inner" style="min-width:max-content">${bkHtml}</div></div>
  </div>
  ${KO_ROUNDS.map(round=>{
    const mIds=koByRound[round];if(!mIds?.length)return'';const rc=KO_COL[round];const done=mIds.filter(id=>state.koR[id]?.played).length;
    return`<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><div style="width:8px;height:8px;border-radius:50%;background:${rc}"></div><span style="font-family:'Oswald',sans-serif;font-size:.8rem;color:${rc};font-weight:600;letter-spacing:.06em">${KO_LABEL[round].toUpperCase()}</span><span style="font-size:.64rem;color:var(--txm)">${done}/${mIds.length} played</span></div>
      <div class="grid">${mIds.map(mId=>{const rv=res[mId]||{};return renderKOCard(mId,rv.teamA,rv.teamB);}).join('')}</div>
    </div>`;
  }).join('')}`;
}

function renderKOCard(mId,tA,tB){
  const r=state.koR[mId];const bc=BRACKET[mId];const rc=KO_COL[bc.r]||'var(--gr)';
  const played=r?.played;const hw=played&&r.winner===tA;const aw=played&&r.winner===tB;const dw=played&&r.hg===r.ag;
  if(!tempS[mId])tempS[mId]={hg:r?.hg||0,ag:r?.ag||0};
  const{hg,ag}=tempS[mId];
  const canEnter=!played&&tA&&tB;
  const descA=tA||(bc.sA?slotDesc(bc.sA):'TBD');const descB=tB||(bc.sB?slotDesc(bc.sB):'TBD');
  return`<div style="background:var(--card);border:1px solid ${played?rc+'55':'var(--b)'};border-radius:9px;padding:10px 12px;margin-bottom:0;box-shadow:var(--shadow)" id="komc-${mId}">
    <div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-family:'Oswald',sans-serif;font-size:.63rem;color:${rc};letter-spacing:.07em">${bc.l}</span>${dw&&played?`<span style="font-size:.6rem;padding:1px 5px;background:rgba(192,112,0,.15);border:1px solid rgba(192,112,0,.4);border-radius:3px;color:var(--amber);font-family:'Oswald',sans-serif;font-weight:600">PENS</span>`:''}</div>
    ${[{name:tA||descA,flag:tA?FLAGS[tA]||'⚽':'🔲',isW:hw,isL:aw&&played,score:r?.hg,side:'hg'},{name:tB||descB,flag:tB?FLAGS[tB]||'⚽':'🔲',isW:aw,isL:hw&&played,score:r?.ag,side:'ag'}].map(({name,flag,isW,isL,score,side})=>`
    <div style="display:flex;align-items:center;gap:7px;padding:5px 7px;border-radius:5px;background:${isW?'rgba(0,122,61,.07)':isL?'rgba(120,120,120,.05)':'transparent'}">
      <span style="font-size:.98rem;filter:${isL?'grayscale(.7)':'none'}">${flag}</span>
      <span style="flex:1;font-size:.82rem;color:${isW?'var(--gr)':isL?'var(--txm)':'var(--tx)'};font-weight:${isW?600:400};${isL?'text-decoration:line-through;text-decoration-color:var(--txm)':''}">${name}</span>
      ${canEnter?`<button class="adj" style="width:26px;height:26px" onclick="adjKo('${mId}','${side}',-1)">−</button><span class="sval" id="sk${side}${mId}" style="font-size:1rem">${tempS[mId][side]}</span><button class="adj" style="width:26px;height:26px" onclick="adjKo('${mId}','${side}',1)">+</button>`:''}
      ${played?`<span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:.92rem;color:${isW?'var(--gr)':'var(--txm)'}">${score}</span>${isW?`<span style="color:var(--gr);font-size:.8rem">✓</span>`:''}`:''}
    </div>`).join('<div style="height:1px;background:var(--b);margin:2px 0"></div>')}
    ${canEnter?`<div id="pens-${mId}" style="display:${hg===ag?'flex':'none'};align-items:center;gap:6px;margin-top:6px;padding:5px 8px;background:rgba(192,112,0,.06);border:1px solid rgba(192,112,0,.25);border-radius:6px"><span style="font-size:.7rem;color:var(--amber);font-family:'Oswald',sans-serif;flex-shrink:0">Pens:</span><select id="kow-${mId}" style="flex:1;padding:4px;background:var(--inp);border:1px solid var(--b);border-radius:5px;color:var(--tx);font-size:.82rem"><option value="">Select winner</option><option value="${tA}">${FLAGS[tA]||''} ${tA}</option><option value="${tB}">${FLAGS[tB]||''} ${tB}</option></select></div>
    <button style="margin-top:8px;width:100%;padding:7px;background:linear-gradient(135deg,${rc},${rc}cc);border:none;border-radius:5px;color:#fff;font-family:'Oswald',sans-serif;font-size:.73rem;font-weight:700;letter-spacing:.06em;cursor:pointer" onclick="saveKo('${mId}')">SAVE RESULT</button>`:''}
    ${played?`<button class="btn-sm" style="margin-top:6px" onclick="clearKo('${mId}')">✕ REMOVE RESULT</button>`:''}
  </div>`;
}

function renderStandings(){
  const lb=calcLeaderboard();const{qual}=computeQual();
  const pot=state.prize.on?state.pc*state.prize.buyin:0;
  const prizeAt=rank=>state.prize.on&&rank<3?Math.round(pot*state.prize.pay[rank]/100):0;
  const champ=state.koR['m104']?.winner;const champP=champ?lb.find(p=>p.breakdown.some(b=>b.name===champ)):null;
  return`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px">
    <div><h2 class="ttl">Standings</h2><div style="font-size:.72rem;color:var(--txm)">Auto-calculated · tap a player for breakdown</div></div>
    ${state.prize.on?`<div style="text-align:right"><div style="font-family:'Oswald',sans-serif;font-size:1.1rem;font-weight:700;color:var(--gold)">£${pot.toLocaleString()}</div><div style="font-size:.62rem;color:var(--txm)">Prize pot</div></div>`:''}
  </div>
  ${todayMatchesHTML()}
  ${champ&&champP?`<div class="card" style="padding:14px;margin-bottom:18px;background:linear-gradient(135deg,rgba(176,120,0,.07),transparent);border-color:rgba(176,120,0,.3);text-align:center;box-shadow:var(--shadow)">
    <div style="font-size:2rem;margin-bottom:6px">🏆</div>
    <div style="font-family:'Oswald',sans-serif;font-size:1.05rem;color:var(--gold);letter-spacing:.04em">${champ} ARE WORLD CHAMPIONS</div>
    <div style="font-size:.85rem;color:var(--tx);margin-top:5px">${champP.name} wins with <b>${champP.total}</b> points!</div>
    ${isAdmin()?`<button onclick="downloadCert(calcLeaderboard()[0])" style="margin-top:12px;padding:8px 18px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));border:none;border-radius:6px;color:#fff;font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:700;cursor:pointer;letter-spacing:.06em">🏆 DOWNLOAD WINNER CERTIFICATE</button>`:''}
  </div>`:''}
  ${lb.every(p=>p.total===0)?`<div class="card" style="padding:16px 14px;margin-bottom:18px;text-align:center;box-shadow:var(--shadow)"><div style="font-size:1.4rem;margin-bottom:6px">⚽</div><div style="font-family:'Oswald',sans-serif;font-size:.82rem;color:var(--txd);letter-spacing:.05em">TOURNAMENT STARTS 11 JUNE 2026</div><div style="font-size:.74rem;color:var(--txm);margin-top:4px">Enter match results in Fixtures and points update here.</div></div>`:''}
  ${lb.map((p,rank)=>{
    const isF=rank===0&&p.total>0;const prz=prizeAt(rank);const open=state.expanded===p.name;
    return`<div class="sc${isF?' gold':''}">
      <div class="sc-hdr" onclick="state.expanded=state.expanded===p.name?null:'${p.name.replace(/'/g,"\\'")}';render()">
        <div style="display:flex;flex-direction:column;align-items:center;width:32px;flex-shrink:0;gap:1px">
        <div style="font-family:'Oswald',sans-serif;font-size:${rank<3?'1.2':'0.88'}rem;color:${rank<3?'inherit':'var(--txm)'};line-height:1">${rank<3?MEDAL[rank]:rank+1}</div>
        ${(()=>{const prev=_prevRanks[p.name];if(!prev||prev===rank+1)return'<span class="rank-chg rank-eq">–</span>';const d=prev-(rank+1);return d>0?`<span class="rank-chg rank-up">▲${d}</span>`:`<span class="rank-chg rank-dn">▼${Math.abs(d)}</span>`;})()}
      </div>
        <div style="flex:1;min-width:0">
          <div style="font-family:'Oswald',sans-serif;font-size:.97rem;font-weight:600;color:var(--tx)">${p.name}</div>
          <div style="font-size:.68rem;color:var(--txm)">${p.breakdown.filter(b=>b.qual==='top2'||b.qual==='best3rd').length}/${p.teams.length} qualified${prz>0?` · <b style="color:var(--gold)">£${prz}</b>`:''}</div>
        </div>
        <div style="text-align:right;flex-shrink:0"><div style="font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;line-height:1;color:${isF?'var(--gold)':p.total>0?'var(--gr)':'var(--txm)'}">${p.total}</div><div style="font-size:.55rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.08em">POINTS</div></div>
        <span style="color:var(--txm);font-size:.68rem;flex-shrink:0">${open?'▲':'▼'}</span>
      </div>
      ${!open?`<div class="tp">${p.breakdown.map(b=>{const q=b.qual||'pending';const out=q==='eliminated';return`<div class="pill" style="background:${QCOL[q]}10;border:1px solid ${QCOL[q]}28;opacity:${out?.6:1}"><span style="font-size:.85rem;filter:${out?'grayscale(.8)':'none'}">${b.flag}</span><span style="color:${out?'var(--txm)':'var(--tx)'};${out?'text-decoration:line-through;text-decoration-color:var(--txm)':''}">${b.name}</span>${b.pts>0?`<span style="font-size:.63rem;color:var(--gr);font-family:'Oswald',sans-serif;font-weight:700">+${b.pts}</span>`:''}</div>`;}).join('')}</div>`:''}
      ${open?`<div style="border-top:1px solid var(--b);padding:10px 13px 12px;background:var(--cardh)">
        ${p.breakdown.map(b=>{const q=b.qual||'pending';const out=q==='eliminated';return`<div style="display:flex;gap:9px;padding:8px 9px;background:var(--card);border-radius:7px;border:1px solid ${out?'var(--b)':QCOL[q]+'25'};margin-bottom:6px;opacity:${out?.65:1};box-shadow:var(--shadow)">
          <span style="font-size:1rem;flex-shrink:0;filter:${out?'grayscale(.7)':'none'}">${b.flag}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="font-size:.8rem;font-weight:600;color:${out?'var(--txd)':'var(--tx)'};${out?'text-decoration:line-through':''}">${b.name}</span>${qBadge(q)}</div>
            <div style="font-size:.68rem;color:var(--txd);line-height:1.7">${b.items.length?b.items.join(' · '):'No results yet'}</div>
          </div>
          <span style="font-family:'Oswald',sans-serif;font-size:.92rem;font-weight:700;color:${b.pts>0?'var(--gr)':'var(--txm)'};flex-shrink:0">${b.pts}</span>
        </div>`;}).join('')}
      </div>`:''}
    </div>`;
  }).join('')}
  <div class="card" style="padding:11px 13px;margin-top:16px;box-shadow:var(--shadow)">
    <div style="font-family:'Oswald',sans-serif;font-size:.67rem;color:var(--txm);letter-spacing:.1em;margin-bottom:8px">SCORING GUIDE</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">${Object.entries(SCR_LBL).filter(([k])=>state.scoring[k]>0).map(([k,l])=>`<div style="display:flex;align-items:center;gap:5px;padding:3px 8px;background:rgba(0,122,61,.06);border:1px solid rgba(0,122,61,.18);border-radius:4px"><span style="font-size:.71rem;color:var(--gr);font-family:'Oswald',sans-serif;font-weight:600">${l}</span><span style="font-size:.65rem;color:var(--txm)">${state.scoring[k]}pts</span></div>`).join('')}</div>
  </div>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function setTab(t){state.tab=t;render();}
function setPC(n){state.pc=Math.max(2,Math.min(24,n));saveSetup();render();}
function render(){
  const tabs=[{id:'setup',l:'⚙ SETUP'},{id:'draw',l:'🎲 DRAW',d:!state.draw},{id:'fixtures',l:'⚽ FIXTURES',d:!state.draw},{id:'tables',l:'📊 TABLES',d:!state.draw},{id:'knockout',l:'🏆 KNOCKOUT',d:!state.draw},{id:'standings',l:'🥇 STANDINGS',d:!state.draw}];
  document.getElementById('tab-nav').innerHTML=tabs.map(t=>`<button class="tab-btn${state.tab===t.id?' active':''}" onclick="${t.d?'':'setTab(\''+t.id+'\')'}" ${t.d?'disabled':''} style="${t.d?'opacity:.25;cursor:not-allowed':''}">${t.l}</button>`).join('');
  updateHdr();
  const c=document.getElementById('content');
  if(state.tab==='setup'){c.innerHTML=renderSetup();if(state.sOpen.manual)renderManualPanel();}
  else if(state.tab==='draw')c.innerHTML=renderDraw();
  else if(state.tab==='fixtures')c.innerHTML=renderFixtures();
  else if(state.tab==='tables')c.innerHTML=renderTables();
  else if(state.tab==='knockout')c.innerHTML=renderKO();
  else if(state.tab==='standings')c.innerHTML=renderStandings();
  document.getElementById('mute-btn').textContent=state.muted?'🔇':'🔊';
  document.getElementById('mute-btn').className='hbtn'+(state.muted?' dim':'');
  // Show sign-out button only when signed in — invisible to regular users
  const lw=document.getElementById('lock-btn-wrap');
  if(lw){lw.innerHTML=isAdmin()?`<button class="hbtn" onclick="_so()" title="Sign out" style="font-size:.7rem;opacity:.75">🗝️</button>`:'';}
  updateResultsBanner();
}

// ── MISC ─────────────────────────────────────────────────────────────────────
async function doReset(){if(!adminSess){showToast('Admin sign-in required','error');return;}await fbDel('wc2026/draw');await fbDel('wc2026/gr');await fbDel('wc2026/ko');state.draw=null;state.grR={};state.koR={};Object.keys(tempS).forEach(k=>delete tempS[k]);editing.clear();recentResults=[];manualMap={};pendingImports=[];state.tab='setup';render();showToast('Everything reset');}
function protectedRunDraw(){requirePin(runDraw);}
function protectedReset(){requirePin(()=>showMod('Reset everything?','Clears draw, all results, starts over.','YES RESET',doReset,true));}
async function copyDraw(){const lb=calcLeaderboard();const lines=[`🏆 ${CONFIG.title}`,'Drawn: '+new Date(state.draw.drawnAt).toLocaleString('en-GB'),''];lb.forEach((p,i)=>{lines.push(`${MEDAL[i]||(i+1)+'.'} ${p.name} — ${p.total} pts`);p.breakdown.forEach(t=>lines.push(`   ${t.flag} ${t.name} (Grp ${t.group})`));lines.push('');});try{await navigator.clipboard.writeText(lines.join('\n'));showToast('Copied!','gold');}catch{showToast('Copy failed','error');}}
function adjKo(id,side,d){if(!tempS[id])tempS[id]={hg:0,ag:0};tempS[id][side]=Math.max(0,(tempS[id][side]||0)+d);const el=document.getElementById(`sk${side}${id}`);if(el)el.textContent=tempS[id][side];const ps=document.getElementById(`pens-${id}`);if(ps)ps.style.display=(tempS[id].hg===tempS[id].ag)?'flex':'none';}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Register service worker for PWA / offline support
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
initTheme();
// Set title from config
if(CONFIG.title){document.title=CONFIG.title;const t=document.querySelector('.hdr-title');if(t)t.textContent=CONFIG.title;}

// Shared URL param (read-only snapshot links)
// Admin access via Firebase Auth — no URL tricks needed
if(loadFromURL()){hideLoading();setConnDot('#f59e0b','Read-only snapshot (no live sync)');render();}
else if(DB){
  // ── FIREBASE MODE: real-time listener syncs all users ─────────────────────
  setLoadMsg('Connecting to Firebase…');
  let first=true;
  // Auth state — adminSess true only when signed into Firebase Auth
  let _authInit=false;
  firebase.auth().onAuthStateChanged(user=>{
    const prev=adminSess;
    adminSess=!!user;
    if(_authInit){
      render();
      if(user&&!prev){
        showToast('Admin mode active 🗝️','gold');
        // Auto-import any queued results immediately on sign-in
        if(pendingImports.length)_autoImport(pendingImports).then(()=>{pendingImports=[];});
        // Trigger a fresh poll
        setTimeout(pollResults,1000);
      } else if(!user&&prev){
        showToast('Signed out');
      }
    }
    _authInit=true;
  });

  DB.ref('wc2026').on('value',snap=>{
    const data=snap.val()||{};
    state.draw=data.draw||null;
    state.grR=data.gr||{};
    state.koR=data.ko||{};
    if(data.cfg){
      if(data.cfg.scoring)state.scoring={...DEF_SCR,...data.cfg.scoring};
      if(data.cfg.prize)state.prize={...{on:false,buyin:5,pay:[60,25,15]},...data.cfg.prize};
      if(data.cfg.names)state.names=[...data.cfg.names,...Array(24).fill('')].slice(0,24);
      if(data.cfg.pc)state.pc=data.cfg.pc;
      if(data.cfg.muted!==undefined)state.muted=data.cfg.muted;
      if(data.cfg.pin)pinHash=data.cfg.pin;
    }
    if(first){
      first=false;
      if(state.draw)state.tab='draw';
      hideLoading();
    }
    recentResults=Object.entries(state.grR).filter(([_,r])=>r.played).slice(-8).map(([id,r])=>{const f=GF[id];return f?{home:f.home,away:f.away,hg:r.hg,ag:r.ag}:null;}).filter(Boolean).reverse();
    render();
  },err=>{console.error('Firebase error:',err);hideLoading();setConnDot('#ef4444','Firebase connection failed — using local storage');localInit();});
  DB.ref('.info/connected').on('value',s=>{setConnDot(s.val()?'#00e676':'#f59e0b',s.val()?'Connected · Live sync active':'Reconnecting…');});
  startPolling();
} else {
  // ── LOCAL STORAGE MODE: single-device, no sync ────────────────────────────
  setLoadMsg('Loading…');setConnDot('#f59e0b','Local mode — Firebase not configured');
  localInit();
}

async function localInit(){
  
  const s=await sGet('wc26h:cfg');
  if(s){if(s.pc)state.pc=Math.max(2,Math.min(24,s.pc));if(s.names)state.names=[...s.names,...Array(24).fill('')].slice(0,24);if(s.scoring)state.scoring={...DEF_SCR,...s.scoring};if(s.prize)state.prize={...{on:false,buyin:5,pay:[60,25,15]},...s.prize};if(s.muted!==undefined)state.muted=s.muted;}
  const d=await sGet('wc26h:draw');if(d){state.draw=d;state.tab='draw';}
  const gr=await sGet('wc26h:gr');if(gr){state.grR=gr;recentResults=Object.entries(gr).filter(([_,r])=>r.played).slice(-8).map(([id,r])=>{const f=GF[id];return f?{home:f.home,away:f.away,hg:r.hg,ag:r.ag}:null;}).filter(Boolean).reverse();}
  const ko=await sGet('wc26h:ko');if(ko)state.koR=ko;
  hideLoading();startPolling();render();
}

</script>
</body>
</html>
