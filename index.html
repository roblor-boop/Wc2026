<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WC 2026">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Carlyle London Office Sweepstake</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Firebase SDK for real-time sync -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
/* ══════════════════════════════════════════════════════════
   THEME SYSTEM — light default, .dark class for dark mode
   ══════════════════════════════════════════════════════════ */
:root {
  /* ── Light mode palette ─────────────────────────────── */
  --bg:       #f4f7fb;
  --bg2:      #edf1f7;
  --card:     #ffffff;
  --cardh:    #f8fafd;
  --inp:      #eef2f8;
  --b:        #dde6f0;
  --bb:       #bfcfe0;
  --gr:       #00802a;   /* slightly darker green = legible on white */
  --grd:      #006020;
  --gr-b:     #00e676;   /* bright accent for badges/highlights */
  --gold:     #a87800;
  --gold-d:   #c49200;
  --tx:       #0c1d32;
  --txd:      #3a5068;
  --txm:      #6a7f96;
  --red:      #be2020;
  --amber:    #a86000;
  --shadow:   0 1px 2px rgba(13,29,50,.04), 0 2px 8px rgba(13,29,50,.05), 0 8px 24px rgba(13,29,50,.04);
  --shadow-lg:0 2px 8px rgba(13,29,50,.06), 0 12px 32px rgba(13,29,50,.10), 0 24px 48px rgba(13,29,50,.06);
  --hdr:      linear-gradient(180deg,#ffffff 0%,#eef3f9 100%);
  --hdr-tx:   #15233b;
  --hdr-dim:  rgba(21,35,59,.5);
  --hdr-hover:rgba(21,35,59,.78);
  --hdr-btn:  rgba(21,35,59,.06);
  --hdr-btnbr:rgba(21,35,59,.12);
  --hdr-active:rgba(0,128,42,.10);
  --hdr-accent:#00863a;
  --hdr-glow: rgba(0,168,56,.10);
  --hdr-bord: rgba(21,35,59,.10);
  --hdr-shadow:0 2px 12px rgba(13,29,50,.08);
  --btn-tx:   #ffffff;
  --pill-gr:  rgba(0,128,42,.10);
  --pill-grbr:rgba(0,128,42,.30);
  --accent:   #00a838;
  --bg-grad:  radial-gradient(1200px 600px at 50% -10%, rgba(0,168,56,.05), transparent 70%), linear-gradient(180deg, #f7f9fc 0%, #eef2f8 100%);
}
html.dark {
  /* ── Dark mode palette ──────────────────────────────── */
  --bg:       #06091a;
  --bg2:      #080c21;
  --card:     #0d1326;
  --cardh:    #111b38;
  --inp:      #090e20;
  --b:        #162040;
  --bb:       #1d2f58;
  --gr:       #00e676;
  --grd:      #00c853;
  --gr-b:     #00e676;
  --gold:     #ffd700;
  --gold-d:   #f59e0b;
  --tx:       #dde6f2;
  --txd:      #8898b2;
  --txm:      #475a70;
  --red:      #f05050;
  --amber:    #f59e0b;
  --shadow:   0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 8px 40px rgba(0,0,0,.6);
  --hdr:      linear-gradient(135deg,#0b1530 0%,#070e22 55%,#04081a 100%);
  --hdr-tx:   #ffffff;
  --hdr-dim:  rgba(255,255,255,.62);
  --hdr-hover:rgba(255,255,255,.9);
  --hdr-btn:  rgba(255,255,255,.09);
  --hdr-btnbr:rgba(255,255,255,.13);
  --hdr-active:rgba(255,255,255,.07);
  --hdr-accent:#00e676;
  --hdr-glow: rgba(0,230,118,.16);
  --hdr-bord: rgba(255,255,255,.08);
  --hdr-shadow:0 4px 30px rgba(7,14,30,.35);
  --btn-tx:   #000000;
  --pill-gr:  rgba(0,230,118,.09);
  --pill-grbr:rgba(0,230,118,.28);
  --accent:   #00e676;
  --bg-grad:  radial-gradient(1200px 600px at 50% -10%, rgba(0,230,118,.06), transparent 70%), linear-gradient(180deg, #070c1c 0%, #04071400 100%);
}
/* ── RESET & BASE ────────────────────────────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--tx);font-family:'Barlow',sans-serif;min-height:100vh;transition:background .25s,color .25s}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b);border-radius:4px}
input,select,button{font-family:'Barlow',sans-serif;outline:none}
/* ── LOADING ─────────────────────────────────────────── */
#loading{position:fixed;inset:0;background:#06091a;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .4s}
#loading.gone{opacity:0;pointer-events:none}
/* ── HEADER ──────────────────────────────────────────── */
#hdr{background:var(--hdr);border-bottom:1px solid var(--hdr-bord);position:sticky;top:0;z-index:50;box-shadow:var(--hdr-shadow);position:relative;overflow:hidden}
#hdr::before{content:'';position:absolute;top:-60%;right:-10%;width:300px;height:300px;background:radial-gradient(circle,var(--hdr-glow),transparent 65%);pointer-events:none}
#hdr-inner{max-width:1180px;margin:0 auto;padding:10px 14px 0}
.hdr-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.hdr-ball{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#00e676,#00b852);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;box-shadow:0 0 16px rgba(0,230,118,.35);cursor:pointer;user-select:none;transition:transform .15s}
.hdr-ball:active{transform:scale(.9)}
.hdr-meta{flex:1;min-width:0}
.hdr-title{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.02em;color:var(--hdr-tx);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){.hdr-title{font-size:.82rem;letter-spacing:0}.hdr-ball{width:30px;height:30px;font-size:.95rem}.hdr-row{gap:8px}.hdr-right{gap:4px}.hbtn{width:27px;height:27px;font-size:.78rem}}
.hdr-sub{font-family:'Oswald',sans-serif;font-size:.57rem;letter-spacing:.25em;color:var(--hdr-accent);margin-top:1px;opacity:.9}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-info{text-align:right;font-size:.64rem;line-height:1.4}
@media(max-width:480px){.hdr-info{display:none}}
.hbtn{width:30px;height:30px;border-radius:7px;background:var(--hdr-btn);border:1px solid var(--hdr-btnbr);color:var(--hdr-tx);font-size:.85rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.hbtn:hover{background:var(--hdr-btnbr)}
.hbtn.dim{opacity:.38}
/* ── CHAMP BAR + PROGRESS ────────────────────────────── */
.champ-bar{margin-bottom:7px;padding:5px 11px;background:linear-gradient(90deg,rgba(255,215,0,.14),transparent);border:1px solid rgba(255,215,0,.38);border-radius:7px;display:flex;align-items:center;gap:7px;font-size:.75rem;color:#ffd700;letter-spacing:.03em}
.prog-wrap{margin-bottom:7px}
.prog-lbl{font-size:.57rem;color:rgba(255,255,255,.32);font-family:'Oswald',sans-serif;letter-spacing:.1em;margin-bottom:3px;display:flex;justify-content:space-between}
.prog-track{height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#00e676,#00c853);border-radius:3px;transition:width .6s ease}
/* ── TABS ────────────────────────────────────────────── */
.tab-nav{display:flex;overflow-x:auto;gap:2px;padding:2px 0 0}
.tab-nav::-webkit-scrollbar{display:none}
.tab-btn{position:relative;padding:11px 14px;font-size:.74rem;background:none;border:none;cursor:pointer;white-space:nowrap;font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.07em;color:var(--hdr-dim);transition:color .18s,background .18s;border-radius:8px 8px 0 0}
.tab-btn:hover{color:var(--hdr-hover);background:var(--hdr-active)}
.tab-btn.active{color:var(--hdr-tx);font-weight:600;background:var(--hdr-active)}
.tab-btn.active::after{content:'';position:absolute;left:14px;right:14px;bottom:0;height:3px;background:var(--accent);border-radius:3px 3px 0 0;box-shadow:0 0 8px var(--hdr-glow)}
.tab-btn:disabled{cursor:not-allowed;opacity:.25}
.tab-btn.live{color:#ff7a7a}
.tab-btn.live.active{color:#fff}
.tab-btn.live.active::after{background:#ff4d4d;box-shadow:0 0 10px rgba(255,77,77,.6)}
.tab-btn.live::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:#ff4d4d;margin-right:6px;vertical-align:middle;animation:liveDot 1.4s ease-in-out infinite}
/* ── LAYOUT ──────────────────────────────────────────── */
main{max-width:1180px;margin:0 auto;padding:16px 12px 70px}
.card{background:var(--card);border:1px solid var(--b);border-radius:14px;box-shadow:var(--shadow);transition:box-shadow .25s,transform .25s}
.ttl{font-family:'Oswald',sans-serif;font-size:1.5rem;font-weight:700;color:var(--tx);margin-bottom:4px;letter-spacing:.01em;line-height:1.1}
.sub{color:var(--txd);font-size:.82rem;margin-bottom:16px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.grid-wide{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
/* ── BUTTONS ─────────────────────────────────────────── */
.btn{padding:8px 18px;border:none;border-radius:7px;cursor:pointer;font-family:'Oswald',sans-serif;font-size:.76rem;font-weight:700;letter-spacing:.07em;transition:all .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn-green{background:linear-gradient(135deg,var(--accent),var(--grd));color:var(--btn-tx);box-shadow:0 2px 8px rgba(0,128,42,.25),inset 0 1px 0 rgba(255,255,255,.15)}
.btn-ghost{background:transparent;border:1px solid var(--b);color:var(--txd)}
.btn-ghost:hover{border-color:var(--bb);background:var(--cardh)}
.btn-danger{background:transparent;border:1px solid rgba(192,32,32,.35);color:var(--red)}
.btn-sm{padding:3px 8px;border-radius:5px;font-family:'Oswald',sans-serif;font-size:.63rem;letter-spacing:.04em;cursor:pointer;border:1px solid var(--b);background:transparent;color:var(--txd);transition:all .15s}
.btn-sm:hover{border-color:var(--bb);background:var(--cardh)}
.btn-draw{padding:14px 30px;background:linear-gradient(135deg,#00e676,#00b852);border:none;border-radius:9px;color:#000;font-family:'Oswald',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:.1em;cursor:pointer;box-shadow:0 4px 20px rgba(0,200,100,.3);animation:glow 2.5s ease-in-out infinite;transition:transform .15s}
.btn-draw:hover{transform:translateY(-1px)}
/* ── SCORE CONTROLS ──────────────────────────────────── */
.adj{width:32px;height:32px;border-radius:7px;background:var(--cardh);border:1px solid var(--b);color:var(--tx);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .12s,border-color .12s;font-weight:600}
.adj:hover{background:var(--b);border-color:var(--bb)}
.sval{width:30px;text-align:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:1.15rem;color:var(--tx)}
/* ── MATCH CARD ──────────────────────────────────────── */
.mc{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;transition:border-color .2s,box-shadow .2s;box-shadow:var(--shadow)}
.mc:hover{box-shadow:var(--shadow-lg)}
.mc.played{border-left:3px solid var(--gr)}
.mc.live-now{border-left:3px solid var(--amber);animation:livePulse 2s ease-in-out infinite}
.mc-meta{display:flex;justify-content:space-between;align-items:flex-start;font-size:.61rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.05em;gap:4px}
.mc-teams{display:flex;align-items:center;gap:6px}
.mc-team{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.mc-team.home{justify-content:flex-end;flex-direction:row-reverse}
.mc-team .tf{font-size:1.3rem;flex-shrink:0;line-height:1}
.mc-team .tn{font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx);font-weight:500}
.mc-team.win .tn{color:var(--gr);font-weight:700}
.mc-team.lose .tn{color:var(--txm);text-decoration:line-through}
.mc-team.lose .tf{opacity:.5}
.score-disp{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.35rem;padding:0 8px;min-width:52px;text-align:center;flex-shrink:0;color:var(--gr);line-height:1}
/* Vertical match rows — team per line */
.mc-rows{display:flex;flex-direction:column;gap:4px}
.mcr{display:flex;align-items:center;gap:9px;padding:5px 2px;min-height:34px}
.mcr-flag{font-size:1.4rem;line-height:1;flex-shrink:0;width:26px;text-align:center}
.mcr-name{flex:1;font-size:.9rem;color:var(--tx);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcr.win .mcr-name{color:var(--gr);font-weight:700}
.mcr.lose .mcr-name{color:var(--txm)}
.mcr.lose .mcr-flag{opacity:.5}
.mcr-score{font-family:'Oswald',sans-serif;font-weight:700;font-size:1.4rem;color:var(--txd);min-width:24px;text-align:center;line-height:1}
.mcr-score.win{color:var(--gr)}
.mcr-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0}
.score-disp.draw{color:var(--amber)}
.mc-foot{display:flex;justify-content:space-between;align-items:center}
.mc-lbl{font-size:.61rem;font-family:'Oswald',sans-serif;letter-spacing:.06em;color:var(--txm);height:16px}
.mc-lbl.win{color:var(--gr)}.mc-lbl.draw{color:var(--amber)}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin-right:4px;animation:liveDot 1.2s ease-in-out infinite}
/* ── CHANNEL BADGE ───────────────────────────────────── */
.ch-bbc{padding:1px 5px;border-radius:3px;font-size:.57rem;font-weight:700;font-family:'Oswald',sans-serif;background:rgba(0,72,148,.1);border:1px solid rgba(0,72,148,.32);color:#0044bb;letter-spacing:.04em}
html.dark .ch-bbc{background:rgba(0,100,220,.15);border-color:rgba(0,100,220,.4);color:#5599ff}
.ch-itv{padding:1px 5px;border-radius:3px;font-size:.57rem;font-weight:700;font-family:'Oswald',sans-serif;background:rgba(180,0,0,.08);border:1px solid rgba(180,0,0,.3);color:#bb0000;letter-spacing:.04em}
html.dark .ch-itv{background:rgba(255,40,40,.1);border-color:rgba(255,40,40,.35);color:#ff6666}
/* ── GROUP TABLE ─────────────────────────────────────── */
.gt{background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:hidden;box-shadow:var(--shadow)}
.gt.complete{border-color:var(--bb)}
.gt-hdr{display:flex;justify-content:space-between;align-items:center;padding:7px 12px;background:var(--cardh);border-bottom:1px solid var(--b)}
.gt-lbl{font-family:'Oswald',sans-serif;font-size:.72rem;color:var(--gr);font-weight:700;letter-spacing:.12em}
.gt-row{display:grid;grid-template-columns:16px 1fr 22px 22px 22px 22px 24px 26px 26px 30px;align-items:center;gap:1px;padding:5px 10px;border-bottom:1px solid var(--b);border-bottom-width:.5px;transition:background .12s}
.gt-row:hover{background:var(--cardh)}
.gt-row.out{opacity:.5}
.gt-cell{font-size:.73rem;font-family:'Oswald',sans-serif;text-align:center;color:var(--txd)}
/* ── STANDINGS ───────────────────────────────────────── */
.sc{background:var(--card);border:1px solid var(--b);border-radius:11px;overflow:hidden;margin-bottom:9px;box-shadow:var(--shadow);transition:box-shadow .2s}
.sc:hover{box-shadow:var(--shadow-lg)}
.sc.gold{border-color:rgba(168,120,0,.4);background:linear-gradient(135deg,rgba(168,120,0,.04),var(--card))}
.sc.me{border-color:var(--gr);box-shadow:0 0 0 1px var(--gr),var(--shadow)}
.sc.me .sc-hdr{background:var(--pill-gr)}
.sc.podium{box-shadow:var(--shadow-lg)}
.sc.gold{border-color:rgba(224,168,46,.45)}
html.dark .sc.gold{border-color:rgba(255,215,0,.3);background:linear-gradient(135deg,rgba(255,215,0,.05),var(--card))}
.sc-hdr{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.sc-body{border-top:1px solid var(--b);padding:10px 14px 12px;background:var(--cardh)}
.pill-wrap{display:flex;flex-wrap:wrap;gap:5px;padding:6px 14px 10px}
.pill{display:flex;align-items:center;gap:4px;padding:4px 8px 4px 6px;border-radius:20px;font-size:.74rem;border:1px solid transparent}
.rank-badge{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-size:.65rem;font-weight:700;flex-shrink:0}
.rank-chg{font-size:.58rem;font-family:'Oswald',sans-serif;font-weight:700;white-space:nowrap}
.rank-up{color:#00802a}.rank-dn{color:var(--red)}.rank-eq{color:var(--txm)}
/* ── KO CARD ─────────────────────────────────────────── */
.koc{background:var(--card);border:1px solid var(--b);border-radius:10px;padding:11px 13px;box-shadow:var(--shadow);transition:box-shadow .2s}
.koc:hover{box-shadow:var(--shadow-lg)}
.ko-slot{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;transition:background .12s}
.ko-slot.win{background:var(--pill-gr);border:1px solid var(--pill-grbr)}
.ko-slot.lose{opacity:.6}
/* ── BRACKET ─────────────────────────────────────────── */
.bk-wrap{overflow-x:auto;padding:4px 0 12px}
.bk-inner{display:flex;align-items:flex-start}
.bk-col{display:flex;flex-direction:column;flex-shrink:0}
.bk-rnd-hdr{font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.1em;color:rgba(255,255,255,.28);text-align:center;padding:5px 4px;white-space:nowrap}
.bk-match{width:170px;margin:2px 10px;border:1px solid var(--b);border-radius:8px;overflow:hidden;background:var(--card);flex-shrink:0;position:relative;box-shadow:var(--shadow)}
.bk-match.final{border-color:rgba(168,120,0,.5);box-shadow:0 0 20px rgba(168,120,0,.15)}
html.dark .bk-match.final{border-color:rgba(255,215,0,.45);box-shadow:0 0 20px rgba(255,215,0,.1)}
.bk-slot{height:34px;display:flex;align-items:center;gap:6px;padding:0 9px;font-size:.73rem;transition:background .12s}
.bk-slot.w{background:var(--pill-gr)}
.bk-slot.l{opacity:.55}
.bk-slot .bn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx)}
.bk-slot.w .bn{color:var(--gr);font-weight:600}
.bk-slot.l .bn{color:var(--txm);text-decoration:line-through}
.bk-div{height:1px;background:var(--b)}
.bk-pair{position:relative;display:flex;flex-direction:column}
.bk-pair::after{content:'';position:absolute;right:-2px;top:calc(25% + 1px);height:50%;width:1px;background:var(--bb);pointer-events:none}
.bk-match.connector::after{content:'';position:absolute;right:-10px;top:50%;width:9px;height:1px;background:var(--bb)}
/* ── DRAW CARDS ──────────────────────────────────────── */
.dc{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:14px;animation:fadeUp .38s ease forwards;opacity:0;box-shadow:var(--shadow);transition:box-shadow .2s}
.dc-hdr{display:flex;align-items:center;gap:9px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--b)}
.dc:hover{box-shadow:var(--shadow-lg)}
.dc.gld{border-color:rgba(168,120,0,.4)}
html.dark .dc.gld{background:linear-gradient(135deg,rgba(255,215,0,.06),var(--card));border-color:rgba(255,215,0,.28)}
.team-row{display:flex;align-items:center;gap:7px;padding:6px 9px;border:1px solid var(--b);border-radius:7px;margin-bottom:4px;background:var(--cardh);transition:background .12s}
.team-row:hover{background:var(--bg2)}
.team-row.out{opacity:.5}
/* ── OVERLAY (Draw ceremony) ─────────────────────────── */
#ov{position:fixed;inset:0;z-index:100;background:rgba(3,5,15,.97);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.ov-bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(0,230,118,.07) 0%,transparent 60%)}
.ov-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;max-width:420px;width:100%}

    Object.entries(state.grR).forEach(([id,r])=>{if(r&&r.played){const f=GF[id];if(f)scan(f.home,f.away,r.hg,r.ag);}});

      if(lb.length>3){const last=lb[lb.length-1];a.push(pick([`🥄 ${last.name} holding up the table on ${last.total} — only way is up!`,`🥄 Someone's gotta prop it up — ${last.name} on ${last.total} (still time!)`,`🐢 ${last.name} taking the scenic route, ${last.total} pts`]));}

      if(me){const i=lb.findIndex(p=>p.name.toLowerCase()===myLc);if(i>=0){const r=i+1,gapTop=Math.round((L.total-lb[i].total)*10)/10;

let _accessHash=null;
async function sha256(s){
  try{const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');}
  catch(e){return 'x'+s;} // fallback (still gates, just weaker) if crypto unavailable
}
function showGate(){const g=document.getElementById('gate');if(g){g.style.display='flex';setTimeout(()=>{const i=document.getElementById('gate-input');if(i)i.focus();},120);}}
function hideGate(){const g=document.getElementById('gate');if(g)g.style.display='none';}
function gateActive(){return !!_accessHash && (!state.gateSignupOnly || !!state.signupOpen);}
function checkGate(){
  if(gateActive()&&localStorage.getItem('wc26gate')!==_accessHash)showGate();
  else hideGate();
}
async function submitGate(){
  const inp=document.getElementById('gate-input'),err=document.getElementById('gate-err');
  if(!inp)return;
  const h=await sha256(inp.value.trim());
  if(h===_accessHash){localStorage.setItem('wc26gate',h);hideGate();maybePlayCeremony();}
  else{if(err)err.textContent='Incorrect code — try again';inp.value='';inp.focus();}
}

function fireConfetti(){
  const cv=document.getElementById('confetti');const ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;cv.style.display='block';
  const cols=['#00e676','#ffd700','#3b82f6','#ef4444','#8b5cf6','#f59e0b','#06b6d4'];
  const ps=Array.from({length:180},()=>({x:Math.random()*cv.width,y:-10-Math.random()*60,vx:(Math.random()-.5)*5,vy:Math.random()*4+2,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*10+4,h:Math.random()*5+3,r:Math.random()*360,vr:(Math.random()-.5)*6}));
  let af;function anim(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.vy+=.05;if(p.y<cv.height+20)alive=true;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r*Math.PI/180);ctx.fillStyle=p.col;ctx.globalAlpha=Math.max(0,1-(p.y/cv.height));ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)af=requestAnimationFrame(anim);else{cv.style.display='none';}}
  af=requestAnimationFrame(anim);setTimeout(()=>{cancelAnimationFrame(af);cv.style.display='none';},5000);
}

async function doDraw(vn){

  state.grR={};state.koR={};Object.keys(tempS).forEach(k=>delete tempS[k]);editing.clear();recentResults=[];manualMap={};
  if(state.signupOpen){state.signupOpen=false;await fbSave('wc2026/signupOpen',false);}
  await fbDel('wc2026/gr');await fbDel('wc2026/ko');
  // Write the draw WITH a ceremony timestamp — every browser on the page
  // detects this and plays the SAME reveal live (see maybePlayCeremony).
  const data={participants:parts,drawnAt:new Date().toISOString(),participantCount:n,ceremonyAt:Date.now()};
  await fbSave('wc2026/draw',data);
  if(!DB){ // local mode has no live listener — play it directly here
    state.draw=data;try{localStorage.setItem('wc26cer',String(data.ceremonyAt));}catch{}
    await playCeremony(parts,n);
  }
  // Firebase mode: the realtime listener fires for everyone (admin included)
  // and triggers the ceremony, so the draw plays live on all open browsers.

// Plays the draw reveal animation from a GIVEN set of participants (so the exact
// same ceremony can run on every viewer's browser, driven by the synced result).
let _cerPlaying=false;
// Spin one element's innerHTML through random teasers, decelerating (slot-machine feel).
async function spinEl(elId,teaserFn,ms){
  // Slot-machine: blurs fast, then a long dramatic slow-down before it lands.
  let t=0;
  while(t<ms&&!drawSkip){
    const el=document.getElementById(elId);if(el)el.innerHTML=teaserFn();
    const prog=Math.min(1,t/ms);
    const d=46+Math.round(prog*prog*prog*474); // 46ms → ~520ms: stays fast, then really slows
    await delay(d);t+=d;
  }
}
async function playCeremony(parts,n){
  if(_cerPlaying)return;
  _cerPlaying=true;
  drawSkip=false;
  const base=Math.floor(48/n),rem=48%n,shared=n>48;
  const F=()=>ALL_TEAMS[Math.floor(Math.random()*ALL_TEAMS.length)];      // random team teaser
  const nm=parts.map(p=>p.name);
  const RN=()=>nm[Math.floor(Math.random()*nm.length)];                    // random name teaser
  showOv();
  // ── INTRO: flags swirl (drumroll) then a 3·2·1 countdown for the final beat of suspense ──
  drawCycleInterval=setInterval(()=>{const t=F();setOv(`<div class="ov-phase-shuffle"><div class="ov-label">THE DRAW</div><div class="ov-flag">${t.flag}</div><div class="ov-name-big">${t.name}</div><div class="ov-dots"><span></span><span></span><span></span></div></div>`);},80);
  try{SFX.drumroll();}catch(e){}
  await skipableDelay(2100);
  clearInterval(drawCycleInterval);
  if(!drawSkip){
    for(const num of ['3','2','1']){
      if(drawSkip)break;
      setOv(`<div class="ov-phase-name"><div class="ov-count-num ov-pop">${num}</div></div>`);
      try{SFX.tick();}catch(e){}
      await skipableDelay(620);
    }
  }
  // Pacing scales with player count so it stays a proper event without dragging
  const tier=n<=16?0:n<=32?1:2;
  const nameHold=[1200,900,600][tier], spinMs=[1550,1100,720][tier], landHold=[2900,2100,1300][tier];
  const revealByTeam=state.drawByTeam||n>48;

  if(!drawSkip&&revealByTeam){
    // ── BY TEAM: each of the 48 teams, spin to reveal who got it ──
    const ownersByTeam={};parts.forEach(p=>p.teams.forEach(t=>{(ownersByTeam[t.name]=ownersByTeam[t.name]||[]).push(p.name);}));
    const tSpin=n>120?640:880, tHold=n>120?950:1450;
    const tCard=(t,ownerInner)=>`<div class="ov-phase-team"><div class="ov-counter">TEAM ${ALL_TEAMS.indexOf(t)+1} OF 48</div><div class="ov-team-card"><div class="ov-flag-big">${t.flag}</div><div class="ov-cname">${t.name}</div><div class="ov-cgroup">GROUP ${t.group}</div></div><div class="ov-for" style="margin-top:14px">GOES TO…</div><div class="ov-owner" id="ov-owner">${ownerInner}</div></div>`;
    for(const team of ALL_TEAMS){
      if(drawSkip)break;
      const own=ownersByTeam[team.name]||[];
      setOv(tCard(team,`<span class="ov-spin-name">${esc(RN())}</span>`));
      await spinEl('ov-owner',()=>`<span class="ov-spin-name">${esc(RN())}</span>`,tSpin);
      if(drawSkip)break;
      const el=document.getElementById('ov-owner');
      if(el)el.innerHTML=`<span class="ov-land" style="color:#fff">${own.length?own.map(esc).join('&nbsp; · &nbsp;'):'<span style="opacity:.5">No owner</span>'}</span>`;
      flashOv();try{SFX.land();}catch(e){}
      await skipableDelay(tHold);
    }
  } else if(!drawSkip){
    // ── BY PLAYER: spotlight the name, ONE roulette that LANDS IN PLACE, then a long pause to read ──
    for(const[idx,p] of parts.entries()){
      if(drawSkip)break;
      const cnt=p.teams.length;const t1=p.teams[0];
      setOv(`<div class="ov-phase-name"><div class="ov-counter">PLAYER ${idx+1} OF ${n}</div><div class="ov-spotlight">${esc(p.name).toUpperCase()}</div><div class="ov-sub">${cnt>1?'drawing '+cnt+' teams…':'spinning for their team…'}</div></div>`);
      try{SFX.ding();}catch(e){}
      await skipableDelay(nameHold);
      if(drawSkip)break;
      // Roulette: one big flag spinning in a single card
      setOv(`<div class="ov-phase-team"><div class="ov-for" id="ov-for">${esc(p.name)}</div><div class="ov-team-card" id="ov-card"><div class="ov-flag-big" id="ov-spinflag">${F().flag}</div><div class="ov-cname" style="opacity:.35">· · ·</div></div><div class="ov-extra" id="ov-extra"></div></div>`);
      await spinEl('ov-spinflag',()=>F().flag,spinMs);
      if(drawSkip)break;
      // The wheel STOPS — the same card fills in with the real team
      const card=document.getElementById('ov-card');
      if(card){card.classList.add('ov-cardland');card.innerHTML=`<div class="ov-flag-big">${t1.flag}</div><div class="ov-cname">${t1.name}</div><div class="ov-cgroup">GROUP ${t1.group}</div>`;}
      const forEl=document.getElementById('ov-for');if(forEl)forEl.innerHTML=`🎉 ${esc(p.name)} ${cnt>1?'GOT '+cnt+' TEAMS':'GOT'}`;
      flashOv();try{SFX.land();}catch(e){}
      // Any further teams pop in just below
      if(cnt>1){
        await skipableDelay(750);if(drawSkip)break;
        const ex=document.getElementById('ov-extra');
        if(ex)ex.innerHTML=`<div class="ov-extra-row">${p.teams.slice(1).map((t,ti)=>`<span class="ov-extra-team ov-pop" style="animation-delay:${ti*.12}s">${t.flag} ${t.name} <span style="opacity:.55">${t.group}</span></span>`).join('')}</div>`;
      }
      // Generous pause to appreciate & read who's been drawn
      await skipableDelay(landHold);
    }
  }
  // ── FINALE ──
  setOv(`<div class="ov-phase-complete"><div style="font-size:2.8rem;margin-bottom:8px">🏆</div><div class="ov-done">DRAW COMPLETE!</div><div class="ov-done-sub" style="margin-top:6px">${n} PLAYERS · ${shared?'1 TEAM EACH (some shared)':base+(rem?'–'+(base+1):'')+' TEAMS EACH'}</div></div>`);
  try{SFX.fanfare();}catch(e){}
  fireConfetti();
  await delay(1900);
  hideOv();
  _cerPlaying=false;
  state.tab='draw';render();
}

// Called from the realtime listener: if a fresh draw just arrived, play the
// reveal live on this browser (once). Old draws / refreshes are skipped.
function maybePlayCeremony(){
  const d=state.draw;

// ── TEAM DISTRIBUTION ─────────────────────────────────────────────────────────
// Provably fair for ANY number of players:
//  • n ≤ 48: the 48 teams are split so everyone has within 1 team of each other;
//            each team is owned by exactly one person.
//  • n > 48: everyone gets exactly 1 team. The 48 teams are shared so each team
//            is owned by either floor(n/48) or ceil(n/48) people — as even as
//            possible. Points count FULLY for every owner, so two people sharing
//            a team each score the same as if they owned it alone. Every player
//            therefore has an identical expected score — it is fair by design.
function distributeTeams(vn){
  const n=vn.length;
  if(n<=48){
    const sh=cryptoShuffle(ALL_TEAMS);
    const base=Math.floor(48/n),rem=48%n;
    const ex=new Set(cryptoShuffle(Array.from({length:n},(_,i)=>i)).slice(0,rem));
    let ti=0;
    return vn.map((name,i)=>{const cnt=base+(ex.has(i)?1:0);const teams=sh.slice(ti,ti+cnt);ti+=cnt;return{name,teams};});
  }
  // n > 48: build a pool of exactly n teams where each team appears either
  // floor(n/48) or ceil(n/48) times — guarantees EVERY team is owned and
  // ownership counts differ by at most 1 (maximally even sharing).
  const base=Math.floor(n/48),extra=n%48;
  const shuffledTeams=cryptoShuffle(ALL_TEAMS);
  let pool=[];
  shuffledTeams.forEach((t,i)=>{
    const copies=base+(i<extra?1:0); // first `extra` teams get one more owner
    for(let c=0;c<copies;c++)pool.push(t);
  });
  pool=cryptoShuffle(pool); // pool.length === n exactly
  const players=cryptoShuffle(vn.slice());
  return players.map((name,i)=>({name,teams:[pool[i]]}));
}
// Describe the split for the UI ("12 players · 4 teams each", etc.)
function distributionLabel(n){
  if(n<2)return'';
  if(n<=48){
    const base=Math.floor(48/n),rem=48%n;
    if(rem===0)return`${base} team${base>1?'s':''} each`;
    return`${base}–${base+1} teams each`;
  }
  const shared=n-48;
  const maxOwners=Math.ceil(n/48);
  return`1 team each · ${shared} team${shared>1?'s':''} shared by ${maxOwners} people 🔁`;
}
function cryptoShuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

// Friendly relative date: "Today", "Tomorrow", or "Sat 13 Jun"
function relDate(dt){
  // ALWAYS "Thu 11 Jun" — one consistent format on every screen.
  try{
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const[day,mon]=dt.split(' ');
    const d=new Date(2026,months[mon],parseInt(day));
    return d.toLocaleDateString('en-GB',{weekday:'short'})+' '+dt;
  }catch{return dt;}
}
function isTodayDt(dt){
  try{
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const[day,mon]=dt.split(' ');const d=new Date(2026,months[mon],parseInt(day));const n=new Date();
    return n.getFullYear()===2026&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate();
  }catch{return false;}
}
function isLiveNow(id){
  // Returns true if this fixture is likely in progress based on BST time
  const f=GF[id];if(!f||state.grR[id]?.played)return false;
  try{
    const now=new Date();
    const months={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
    const[day,mon]=f.dt.split(' ');const[h,m]=f.tm.replace('✝','').split(':');
    const ko=new Date(2026,months[mon],parseInt(day),parseInt(h),parseInt(m));
    const diff=(now-ko)/60000;// minutes since KO
    return diff>=0&&diff<=105;// 0–105 mins (90 + 15 extra time buffer)
  }catch{return false;}
}

// ── CALCULATIONS ──────────────────────────────────────────────────────────────
function groupTable(g){
  const s={};GD[g].forEach(t=>{s[t.n]={name:t.n,flag:t.f,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0};});
  let played=0;
  GF_IDS[g].forEach(id=>{const r=state.grR[id];if(!r?.played)return;played++;const{hg,ag}=r,f=GF[id];s[f.home].P++;s[f.away].P++;s[f.home].GF+=hg;s[f.home].GA+=ag;s[f.home].GD+=hg-ag;s[f.away].GF+=ag;s[f.away].GA+=hg;s[f.away].GD+=ag-hg;if(hg>ag){s[f.home].W++;s[f.home].Pts+=3;s[f.away].L++;}else if(hg<ag){s[f.away].W++;s[f.away].Pts+=3;s[f.home].L++;}else{s[f.home].D++;s[f.away].D++;s[f.home].Pts++;s[f.away].Pts++;}});
  return{complete:played===6,played,rows:Object.values(s).sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF||a.name.localeCompare(b.name))};
}
function computeQual(){
  const tables={};let allDone=true;
  Object.keys(GD).forEach(g=>{tables[g]=groupTable(g);if(!tables[g].complete)allDone=false;});
  const q={};const thirds=[];
  Object.entries(tables).forEach(([g,{complete,rows}])=>{if(complete){q[rows[0].name]='top2';q[rows[1].name]='top2';thirds.push({...rows[2],group:g});q[rows[2].name]='maybe3rd';q[rows[3].name]='eliminated';}else rows.forEach(r=>{if(!q[r.name])q[r.name]='pending';});});
  if(allDone){thirds.sort((a,b)=>b.Pts-a.Pts||b.GD-a.GD||b.GF-a.GF);thirds.forEach((t,i)=>{q[t.name]=i<8?'best3rd':'eliminated';});}
  return{qual:q,thirds,tables};
}
// Assign the 8 qualifying 3rd-place teams to the 8 best-3rd R32 slots so each
// slot gets a DISTINCT eligible team (a perfect matching respecting FIFA's
// per-slot group eligibility). Prevents the same 3rd-placed team appearing twice.
function bestThirdAssignment(tables,thirds){
  const q8=thirds.slice(0,8);
  if(q8.length<8)return null;                 // groups not all finished yet
  const slots=[];
  Object.keys(BRACKET).forEach(id=>{['sA','sB'].forEach(side=>{const sl=BRACKET[id][side];if(sl&&sl.t==='best3rd')slots.push({key:id+'_'+side,gs:sl.gs});});});
  const assign={},used=new Set();
  const bt=i=>{if(i===slots.length)return true;const s=slots[i];for(const t of q8){if(used.has(t.name))continue;if(!s.gs.includes(t.group))continue;assign[s.key]=t.name;used.add(t.name);if(bt(i+1))return true;used.delete(t.name);delete assign[s.key];}return false;};
  return bt(0)?assign:null;
}
function resolveSlot(sl,tables,thirds,assign,key){
  if(sl.t==='winner')return tables[sl.g]?.complete?tables[sl.g].rows[0].name:null;
  if(sl.t==='runnerup')return tables[sl.g]?.complete?tables[sl.g].rows[1].name:null;
  if(sl.t==='best3rd')return (assign&&assign[key])||null;
  if(sl.t==='prev'){const m=state.koR[sl.m];return m?.played?m.winner:null;}
  if(sl.t==='loser'){const m=state.koR[sl.m];if(!m?.played)return null;return m.home===m.winner?m.away:m.home;}
  return null;
}
function resolveBracket(){const{tables,thirds}=computeQual();const assign=bestThirdAssignment(tables,thirds);const res={};Object.keys(BRACKET).forEach(id=>{const b=BRACKET[id];res[id]={teamA:resolveSlot(b.sA,tables,thirds,assign,id+'_sA'),teamB:resolveSlot(b.sB,tables,thirds,assign,id+'_sB')};});return res;}
function slotDesc(sl){if(sl.t==='winner')return`Winner Grp ${sl.g}`;if(sl.t==='runnerup')return`Runner-up Grp ${sl.g}`;if(sl.t==='best3rd')return`Best 3rd`;if(sl.t==='prev')return`W ${BRACKET[sl.m]?.l||sl.m}`;if(sl.t==='loser')return`L ${BRACKET[sl.m]?.l||sl.m}`;return'TBD';}
function calcLeaderboard(){
  if(!state.draw)return[];
  const{qual}=computeQual();const koArr=Object.values(state.koR).filter(m=>m.played);
  const champ=state.koR['m104']&&state.koR['m104'].played?state.koR['m104'].winner:null;
  const predMap={};if(state.predict.on)Object.values(state.signups||{}).forEach(s=>{if(s&&s.name&&s.prediction)predMap[s.name.toLowerCase()]=s.prediction;});
  return state.draw.participants.map(p=>{
    let total=0,pGoals=0,pKoWins=0;const breakdown=p.teams.map(team=>{
      let pts=0;const items=[];let gW=0,gD=0,gL=0,goals=0;
      Object.entries(GF).filter(([_,f])=>f.home===team.name||f.away===team.name).forEach(([id,f])=>{const r=state.grR[id];if(!r?.played)return;const isH=f.home===team.name,tf=isH?r.hg:r.ag,ta=isH?r.ag:r.hg;goals+=tf;if(tf>ta)gW++;else if(tf===ta)gD++;else gL++;});
      // knockout goals (for tiebreak)
      koArr.forEach(m=>{if(m.home===team.name)goals+=m.hg||0;else if(m.away===team.name)goals+=m.ag||0;});
      if(gW){pts+=gW*state.scoring.group_win;items.push(`${gW}W +${gW*state.scoring.group_win}`);}
      if(gD){pts+=gD*state.scoring.group_draw;items.push(`${gD}D +${gD*state.scoring.group_draw}`);}
      if(gL)items.push(`${gL}L`);
      if(state.scoring.goal_bonus>0&&goals>0){pts+=goals*state.scoring.goal_bonus;items.push(`${goals}⚽ +${+(goals*state.scoring.goal_bonus).toFixed(1)}`);}
      const qv=qual[team.name]||'pending';
      if(qv==='top2'){pts+=state.scoring.qualify_top2;items.push(`Qual +${state.scoring.qualify_top2}`);}
      else if(qv==='best3rd'){pts+=state.scoring.qualify_3rd;items.push(`Best 3rd +${state.scoring.qualify_3rd}`);}
      const wins=koArr.filter(m=>m.winner===team.name);wins.forEach(m=>{const p2=state.scoring[`win_${m.round}`]||0;pts+=p2;items.push(`${KO_LABEL[m.round]} win +${p2}`);});
      pKoWins+=wins.length;pGoals+=goals;
      total+=pts;
      return{name:team.name,flag:team.flag,group:team.group,pts:Math.round(pts*10)/10,items,qual:qv};
    });
    const myPred=state.predict.on?(predMap[p.name.toLowerCase()]||null):null;
    let predBonus=0,predCorrect=false;
    if(myPred&&champ){predCorrect=myPred===champ;if(predCorrect)predBonus=state.predict.bonus||0;}
    total+=predBonus;
    return{...p,total:Math.round(total*10)/10,breakdown,koWins:pKoWins,goalsFor:pGoals,pred:{team:myPred,correct:predCorrect,bonus:predBonus}};
  // Tiebreakers so 1st place is always decisive & fair: points → correct champion prediction → knockout wins → goals scored → name
  }).sort((a,b)=>b.total-a.total||((b.pred&&b.pred.correct?1:0)-(a.pred&&a.pred.correct?1:0))||b.koWins-a.koWins||b.goalsFor-a.goalsFor||a.name.localeCompare(b.name));
}

// Matches that are in their kickoff window OR have a live score entered.
function liveMatchIds(){
  const ids=new Set();
  Object.keys(state.live||{}).forEach(id=>{if(GF[id]&&!state.grR[id]?.played)ids.add(id);}); // only valid, unfinished fixtures
  Object.keys(GF).forEach(id=>{if(isLiveNow(id)&&!state.grR[id]?.played)ids.add(id);});
  return [...ids];
}
// Provisional leaderboard: standings AS IF live scores counted right now.
// Returns {prov, base} so we can show movement. Mutates+restores state.grR.
function calcProvisional(){
  const live=state.live||{};
  if(!Object.keys(live).length)return null;
  const real=state.grR;
  const merged={...real};
  Object.entries(live).forEach(([id,s])=>{if(GF[id])merged[id]={hg:s.hg||0,ag:s.ag||0,played:true};});
  const base=calcLeaderboard();           // current official standings
  state.grR=merged;
  const prov=calcLeaderboard();            // standings with live overlaid
  state.grR=real;                          // restore
  return{prov,base};
}

async function submitSignup(){
  const fEl=document.getElementById('signup-fname'),lEl=document.getElementById('signup-lname');
  if(!fEl||!lEl)return;
  const first=fEl.value.trim(),last=lEl.value.trim();
  if(first.length<2){showToast('Please enter your first name','error');fEl.focus();return;}
  if(last.length<2){showToast('Last name required — so the organiser knows who you are','error');lEl.focus();return;}
  // Title-case both names for consistency
  const tc=s=>s.charAt(0).toUpperCase()+s.slice(1);
  const name=tc(first)+' '+tc(last);
  // Prevent duplicate sign-ups of the same name
  const existing=Object.values(state.signups||{}).map(s=>(s.name||'').toLowerCase());
  if(existing.includes(name.toLowerCase())){showToast('That name is already signed up','error');return;}
  // Signups path is publicly writable (see Firebase rules)
  try{
    const key='s'+Date.now()+Math.floor(Math.random()*1000);
    const predEl=document.getElementById('signup-pred');
    const prediction=(state.predict.on&&predEl)?predEl.value||'':'';
    const rec={name,at:Date.now()};if(prediction)rec.prediction=prediction;
    if(DB){await DB.ref('wc2026/signups/'+key).set(rec);}
    else{if(!state.signups)state.signups={};state.signups[key]=rec;}
    try{localStorage.setItem('wc26me',name);}catch(e){}
    showToast("You're in, "+name.split(' ')[0]+"! 🎉",'gold');
    render();
  }catch(e){showToast('Sign-up failed, try again','error');}
}

// Sign-ups sorted by time they joined (stable order)
function signupNames(){
  return Object.values(state.signups||{})

async function testFeed(){
  const sEl=document.getElementById('feed-status');
  const rEl=document.getElementById('feed-result');
  if(!apiKey()||apiKey()==='PASTE_FOOTBALL_API_KEY'){
    if(rEl)rEl.innerHTML='<div style="margin-top:10px;padding:9px 11px;background:rgba(168,96,0,.08);border:1px solid rgba(168,96,0,.3);border-radius:7px;font-size:.76rem;color:var(--amber)">⚠ No API key set. Add your football-data.org key to enable auto-results.</div>';
    return;
  }
  if(rEl)rEl.innerHTML='<div style="margin-top:10px;font-size:.78rem;color:var(--txm)">⏳ Testing connection…</div>';
  try{
    const res=await fetch('https://api.football-data.org/v4/competitions/WC/matches',{headers:{'X-Auth-Token':apiKey()}});
    if(res.status===403||res.status===401){
      rEl.innerHTML='<div style="margin-top:10px;padding:9px 11px;background:rgba(192,32,32,.08);border:1px solid rgba(192,32,32,.3);border-radius:7px;font-size:.76rem;color:var(--red)">✗ API key rejected (HTTP '+res.status+'). Check the key is correct and your email is verified.</div>';
      return;
    }
    if(res.status===429){
      rEl.innerHTML='<div style="margin-top:10px;padding:9px 11px;background:rgba(168,96,0,.08);border:1px solid rgba(168,96,0,.3);border-radius:7px;font-size:.76rem;color:var(--amber)">⚠ Rate limited (HTTP 429). The free tier allows 10 calls/min — wait a moment and retry.</div>';
      return;
    }
    if(!res.ok){
      rEl.innerHTML='<div style="margin-top:10px;padding:9px 11px;background:rgba(192,32,32,.08);border:1px solid rgba(192,32,32,.3);border-radius:7px;font-size:.76rem;color:var(--red)">✗ Connection failed (HTTP '+res.status+').</div>';
      return;
    }
    const data=await res.json();
    const total=(data.matches||[]).length;
    const finished=(data.matches||[]).filter(m=>m.status==='FINISHED').length;
    const scheduled=(data.matches||[]).filter(m=>m.status==='SCHEDULED'||m.status==='TIMED').length;
    // Test name matching on the fixtures we have
    let matched=0;const bk=resolveBracket();
    (data.matches||[]).forEach(m=>{
      const hn=normTeam(m.homeTeam?.name||''),an=normTeam(m.awayTeam?.name||'');
      if(findGFId(hn,an)||findKOId(hn,an,bk))matched++;
    });
    rEl.innerHTML='<div style="margin-top:10px;padding:10px 12px;background:rgba(0,128,42,.07);border:1px solid rgba(0,128,42,.3);border-radius:7px;font-size:.76rem;color:var(--gr);line-height:1.7">'+
      '✓ <b>Feed connected</b><br>'+
      '<span style="color:var(--txd)">Competition matches found: '+total+'<br>'+
      'Finished: '+finished+' · Upcoming: '+scheduled+'<br>'+
      'Matching your fixtures: '+matched+'/'+total+'</span>'+
      (total===0?'<br><span style="color:var(--amber)">Note: WC2026 fixtures may not be loaded by the provider until closer to kick-off. The feed will start matching automatically once they are.</span>':'')+
      '</div>';
    if(sEl)sEl.innerHTML='Last tested: '+new Date().toLocaleTimeString('en-GB')+' · working ✓';
  }catch(e){
    rEl.innerHTML='<div style="margin-top:10px;padding:9px 11px;background:rgba(192,32,32,.08);border:1px solid rgba(192,32,32,.3);border-radius:7px;font-size:.76rem;color:var(--red)">✗ Network error: '+(e.message||'could not reach the API')+'</div>';
  }
}

function renderLive(){
  const ids=liveMatchIds();
  if(!ids.length){
    return`<div style="text-align:center;padding:48px 20px"><div style="font-size:2.6rem;margin-bottom:12px">📺</div><div style="font-family:'Oswald',sans-serif;font-size:1rem;color:var(--tx);letter-spacing:.03em;margin-bottom:6px">NOTHING ON RIGHT NOW</div><p style="font-size:.8rem;color:var(--txm);line-height:1.6">When a match kicks off it'll appear here automatically — with the score, the channel, and which players have teams playing.</p></div>`;
  }
  ids.sort((a,b)=>{const la=state.live[a]?1:0,lb=state.live[b]?1:0;return lb-la;});
  const hasAnyScore=ids.some(id=>state.live[id]);
  const prov=hasAnyScore?calcProvisional():null;
  const myName=getMyName();
  const liveTeams=new Set();ids.forEach(id=>{liveTeams.add(GF[id].home);liveTeams.add(GF[id].away);});
  // who owns a given team (sweepstake players)
  const owners=team=>!state.draw?[]:state.draw.participants.filter(p=>p.teams.some(t=>t.name===team)).map(p=>p.name);
  return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
    <span class="live-dot" style="width:10px;height:10px"></span>
    <h2 class="ttl" style="margin:0">On Now</h2>
    <span style="font-size:.7rem;color:var(--txm);margin-left:auto">${ids.length} match${ids.length>1?'es':''}</span>
  </div>
  <p class="sub">Updates automatically as results come in. No input needed.</p>
  ${ids.map(id=>{
    const f=GF[id];const s=state.live[id];const admin=isAdmin();
    const hasScore=!!s;const hg=s?.hg||0,ag=s?.ag||0;
    const hw=hasScore&&hg>ag,aw=hasScore&&ag>hg;
    const ownH=owners(f.home),ownA=owners(f.away);
    const myH=myName&&ownH.includes(myName),myA=myName&&ownA.includes(myName);
    const ownerLine=(names,mine)=>names.length?`<div style="font-size:.62rem;color:${mine?'var(--gr)':'var(--txm)'};margin-top:3px;font-weight:${mine?'700':'400'}">${mine?'⭐ ':''}${names.slice(0,3).join(', ')}${names.length>3?` +${names.length-3}`:''}</div>`:'<div style="font-size:.62rem;color:var(--txm);margin-top:3px;opacity:.5">no owner</div>';
    return`<div class="card live-card" style="padding:14px;margin-bottom:12px;border-left:3px solid var(--amber)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <span style="display:flex;align-items:center;gap:5px;font-family:'Oswald',sans-serif;font-size:.66rem;letter-spacing:.08em;color:var(--amber);font-weight:700"><span class="live-dot"></span>${hasScore?'LIVE':'KICKS OFF '+f.tm}${f.ch?` · ${f.ch}`:''}</span>
        <span style="font-size:.64rem;color:var(--txm);font-family:'Oswald',sans-serif">Grp ${f.group} · MD${f.matchday}</span>
      </div>
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1;text-align:center;min-width:0"><div style="font-size:2.2rem;line-height:1">${f.flagH||FLAGS[f.home]||'⚽'}</div><div style="font-size:.82rem;font-weight:${hw?'700':'500'};color:${hw?'var(--gr)':'var(--tx)'};margin-top:4px;line-height:1.2">${f.home}</div>${ownerLine(ownH,myH)}</div>
        <div style="text-align:center;flex-shrink:0">
          ${hasScore?`<div style="font-family:'Oswald',sans-serif;font-weight:700;font-size:2.6rem;color:var(--tx);line-height:1">${hg}<span style="color:var(--txm)">:</span>${ag}</div>`:`<div style="font-family:'Oswald',sans-serif;font-size:1.1rem;color:var(--txm);letter-spacing:.1em">v</div>`}
        </div>
        <div style="flex:1;text-align:center;min-width:0"><div style="font-size:2.2rem;line-height:1">${f.flagA||FLAGS[f.away]||'⚽'}</div><div style="font-size:.82rem;font-weight:${aw?'700':'500'};color:${aw?'var(--gr)':'var(--tx)'};margin-top:4px;line-height:1.2">${f.away}</div>${ownerLine(ownA,myA)}</div>
      </div>
      ${admin?`<details style="margin-top:11px"><summary style="font-size:.64rem;color:var(--txm);cursor:pointer;list-style:none">⚙ Update score manually (optional)</summary>
        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:9px">
          <div style="display:flex;flex-direction:column;gap:3px"><button class="adj" onclick="adjLive('${id}','hg',1)" style="width:28px;height:22px">+</button><button class="adj" onclick="adjLive('${id}','hg',-1)" style="width:28px;height:22px">−</button></div>
          <span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:1.4rem;min-width:48px">${hg}:${ag}</span>
          <div style="display:flex;flex-direction:column;gap:3px"><button class="adj" onclick="adjLive('${id}','ag',1)" style="width:28px;height:22px">+</button><button class="adj" onclick="adjLive('${id}','ag',-1)" style="width:28px;height:22px">−</button></div>
        </div>
        <div style="display:flex;gap:8px;margin-top:9px"><button class="btn btn-green" style="flex:1;font-size:.72rem" onclick="endLive('${id}')">FULL TIME — SAVE</button>${hasScore?`<button class="btn-sm" style="color:var(--red);border-color:rgba(192,32,32,.3)" onclick="cancelLive('${id}')">✕</button>`:''}</div>
      </details>`:''}
    </div>`;
  }).join('')}
  ${prov?(()=>{
    const baseRank={};prov.base.forEach((p,i)=>baseRank[p.name]=i+1);
    const affected=prov.prov.filter(p=>p.breakdown.some(b=>liveTeams.has(b.name)));
    return`<div class="card" style="padding:14px;margin-top:4px">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:4px"><span class="live-dot"></span><div style="font-family:'Oswald',sans-serif;font-size:.82rem;font-weight:700;color:var(--tx);letter-spacing:.03em">LIVE TABLE</div></div>
      <p style="font-size:.7rem;color:var(--txm);margin-bottom:12px">Provisional standings if the live scores held right now. ${affected.length?`<b style="color:var(--amber)">${affected.length} player${affected.length>1?'s':''}</b> affected.`:''}</p>
      ${prov.prov.slice(0,10).map((p,i)=>{
        const provR=i+1,wasR=baseRank[p.name]||provR;const mv=wasR-provR;
        const hasLiveTeam=p.breakdown.some(b=>liveTeams.has(b.name));
        const isMe=myName&&p.name===myName;
        return`<div style="display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px solid var(--b);border-bottom-width:.5px;${hasLiveTeam?'background:rgba(168,96,0,.05);border-radius:6px':''}">
          <span style="font-family:'Oswald',sans-serif;font-size:.8rem;font-weight:700;color:var(--txm);width:18px;text-align:center">${provR}</span>
          ${mv!==0?`<span class="rank-chg ${mv>0?'rank-up':'rank-dn'}" style="width:26px">${mv>0?'▲'+mv:'▼'+Math.abs(mv)}</span>`:'<span style="width:26px;text-align:center;color:var(--txm);font-size:.6rem">–</span>'}
          <span style="flex:1;font-size:.85rem;color:var(--tx);font-weight:${isMe?'700':'500'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${p.name}${isMe?' <span style="font-size:.5rem;background:var(--gr);color:var(--btn-tx);padding:1px 5px;border-radius:8px;font-weight:700">YOU</span>':''}${hasLiveTeam?' <span class="live-dot" style="margin-left:2px"></span>':''}</span>
          <span style="font-family:'Oswald',sans-serif;font-weight:700;font-size:1rem;color:var(--gr)">${p.total}</span>
        </div>`;
      }).join('')}
      ${prov.prov.length>10?`<div style="text-align:center;font-size:.68rem;color:var(--txm);padding-top:8px">+ ${prov.prov.length-10} more</div>`:''}
    </div>`;
  })():`<div class="card" style="padding:13px 14px;font-size:.74rem;color:var(--txm);line-height:1.6">Live scores appear here automatically if available from the results feed. Final results always import on their own once each match finishes — the standings and bracket then update for everyone.</div>`}`;
}

function renderFixtures(){

          <div style="font-family:'Oswald',sans-serif;font-size:.97rem;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px">${p.name}${isMe?'<span style="font-size:.55rem;background:var(--gr);color:var(--btn-tx);padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.05em">YOU</span>':''}${state.prize.on&&state.paid&&state.paid[p.name]?'<span title="Paid up" style="display:inline-flex;align-items:center;gap:2px;font-size:.52rem;background:var(--pill-gr);color:var(--gr);border:1px solid var(--pill-grbr);padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.04em">✓ PAID</span>':''}${rank===lb.length-1&&lb.length>3&&p.total>0&&rank!==0?'<span title="Bottom of the table" style="font-size:.52rem;background:rgba(168,96,0,.12);color:var(--amber);border:1px solid rgba(168,96,0,.3);padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.04em">🥄 WOODEN SPOON</span>':''}${state.predict.on&&p.pred&&p.pred.correct?'<span title="Correctly predicted the champion" style="font-size:.52rem;background:var(--pill-gr);color:var(--gr);border:1px solid var(--pill-grbr);padding:1px 6px;border-radius:10px;font-weight:700;letter-spacing:.04em">🔮 NAILED IT</span>':''}</div>
          <div style="font-size:.68rem;color:var(--txm);margin-bottom:4px">${p.breakdown.filter(b=>b.qual==='top2'||b.qual==='best3rd').length}/${p.teams.length} qualified${prz>0?` · <b style="color:var(--gold)">£${prz}</b>`:''}${state.podium.on&&rank<3&&p.total>0&&state.podium.prizes[rank]?` · <span style="color:var(--gold)">🏆 ${esc(state.podium.prizes[rank])}</span>`:''}</div>
          <div style="height:4px;background:var(--inp);border-radius:3px;overflow:hidden"><div style="height:100%;width:${pctW}%;background:${isF?'linear-gradient(90deg,var(--gold),var(--gold-d))':'linear-gradient(90deg,var(--accent),var(--gr))'};border-radius:3px;transition:width .6s ease"></div></div>
        </div>
        <div style="text-align:right;flex-shrink:0"><div style="font-family:'Oswald',sans-serif;font-size:1.4rem;font-weight:700;line-height:1;color:${isF?'var(--gold)':p.total>0?'var(--gr)':'var(--txm)'}">${p.total}</div><div style="font-size:.55rem;color:var(--txm);font-family:'Oswald',sans-serif;letter-spacing:.08em">POINTS</div></div>
        <span style="color:var(--txm);font-size:.68rem;flex-shrink:0">${open?'▲':'▼'}</span>
      </div>
      ${!open?`<div class="pill-wrap">${p.breakdown.map(b=>{const q=b.qual||'pending';const out=q==='eliminated';return`<div class="pill" style="background:${QCOL[q]}10;border:1px solid ${QCOL[q]}28;opacity:${out?.6:1}"><span style="font-size:.85rem;filter:${out?'grayscale(.8)':'none'}">${b.flag}</span><span style="color:${out?'var(--txm)':'var(--tx)'};${out?'text-decoration:line-through;text-decoration-color:var(--txm)':''}">${b.name}</span>${b.pts>0?`<span style="font-size:.63rem;color:var(--gr);font-family:'Oswald',sans-serif;font-weight:700">+${b.pts}</span>`:''}</div>`;}).join('')}</div>`:''}
      ${open?`<div style="border-top:1px solid var(--b);padding:10px 13px 12px;background:var(--cardh)">
        <button onclick="event.stopPropagation();setMyName('${safeName}')" style="width:100%;padding:7px;margin-bottom:10px;background:${isMe?'var(--pill-gr)':'transparent'};border:1px solid ${isMe?'var(--gr)':'var(--b)'};border-radius:7px;color:${isMe?'var(--gr)':'var(--txd)'};font-family:'Oswald',sans-serif;font-size:.7rem;letter-spacing:.05em;cursor:pointer">${isMe?'✓ THIS IS ME — TAP TO UNPIN':'⭐ MARK AS ME'}</button>
        ${state.predict.on&&p.pred&&p.pred.team?`<div style="display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:8px;background:var(--card);border:1px solid ${p.pred.correct?'var(--pill-grbr)':'var(--b)'};border-radius:7px;font-size:.78rem"><span style="font-size:1rem">🔮</span><span style="flex:1;color:var(--txm)">Predicted winner: <b style="color:var(--tx)">${p.pred.team}</b></span>${champ?`<span style="font-family:'Oswald',sans-serif;font-weight:700;color:${p.pred.correct?'var(--gr)':'var(--txm)'}">${p.pred.correct?'✓ +'+p.pred.bonus:'✗ missed'}</span>`:`<span style="font-size:.68rem;color:var(--txm)">awaiting Final</span>`}</div>`:''}
        ${p.breakdown.map(b=>{const q=b.qual||'pending';const out=q==='eliminated';return`<div style="display:flex;gap:9px;padding:8px 9px;background:var(--card);border-radius:7px;border:1px solid ${out?'var(--b)':QCOL[q]+'25'};margin-bottom:6px;opacity:${out?.65:1};box-shadow:var(--shadow)">
          <span style="font-size:1rem;flex-shrink:0;filter:${out?'grayscale(.7)':'none'}">${b.flag}</span>
          <div style="flex:1;min-width:0">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:3px"><span style="font-size:.8rem;font-weight:600;color:${out?'var(--txd)':'var(--tx)'};${out?'text-decoration:line-through':''}">${b.name}</span>${qBadge(q)}</div>
            <div style="font-size:.68rem;color:var(--txd);line-height:1.7">${b.items.length?b.items.join(' · '):'No results yet'}</div>
          </div>
          <span style="font-family:'Oswald',sans-serif;font-size:.92rem;font-weight:700;color:${b.pts>0?'var(--gr)':'var(--txm)'};flex-shrink:0">${b.pts}</span>
        </div>`;}).join('')}
      </div>`:''}
    </div>`;
  }).join('')})()}
  <div style="margin-top:16px">${rulesHTML()}</div>`;
}

// ── MAIN RENDER ───────────────────────────────────────────────────────────────
function setTab(t){state.tab=t;render();}
function setPC(n){if(!adminSess)return;state.pc=Math.max(2,Math.min(MAX_PLAYERS,n));saveSetup();render();}
// ── PARTICIPANT MANAGEMENT ────────────────────────────────────────────────────
function addParticipant(){
  if(!adminSess)return;
  if(state.pc>=MAX_PLAYERS){showToast('Maximum '+MAX_PLAYERS+' players','error');return;}
  state.pc++;
  saveSetup();render();
  // Focus the new (last) input
  setTimeout(()=>{const inputs=document.querySelectorAll('input[placeholder^="Player"]');const last=inputs[inputs.length-1];if(last)last.focus();},60);
}
function removeParticipant(i){
  if(!adminSess)return;
  if(state.pc<=2){showToast('Need at least 2 players','error');return;}
  const nm=(state.names[i]||'').trim();
  const doRemove=()=>{
    state.names.splice(i,1);
    state.names.push('');
    state.pc=Math.max(2,state.pc-1);
    saveSetup();render();
    showToast(nm?`Removed ${nm}`:'Removed');
  };
  // Confirm only if the slot has a name; empty slots remove instantly
  if(nm)showMod('Remove player?',`Remove "${nm}" from the list?`,'REMOVE',doRemove,true);
  else doRemove();
}
function clearAllParticipants(){
  if(!adminSess)return;
  showMod('Clear all players?','This empties every name box. The player count stays the same.','CLEAR ALL',()=>{
    state.names=Array(96).fill('');
    saveSetup();render();showToast('All players cleared');
  },true);
}
// Live-highlight duplicate name borders without a full re-render (smoother typing)
let _dupeTimer=null;
function _rerenderStandings(){
  clearTimeout(window._sqT);
  window._sqT=setTimeout(()=>{const c=document.getElementById('content');if(c&&state.tab==='standings'){const el=document.activeElement;const pos=el?.selectionStart;c.innerHTML=renderStandings();const ni=c.querySelector('input[placeholder*="Find"]');if(ni){ni.focus();if(pos!=null)try{ni.setSelectionRange(pos,pos);}catch{}}}},120);
}
function flagDupes(){
  clearTimeout(_dupeTimer);
  _dupeTimer=setTimeout(()=>{
    const inputs=[...document.querySelectorAll('input[placeholder^="Player"]')];
    const vals=inputs.map(el=>el.value.trim().toLowerCase());
    inputs.forEach((el,i)=>{
      const v=vals[i];
      const dupe=v&&vals.indexOf(v)!==i;
      const filled=el.value.trim();
      el.style.borderColor=dupe?'var(--amber)':filled?'var(--bb)':'var(--b)';
    });
  },200);
}
function togglePaid(name){if(!adminSess)return;if(!state.paid)state.paid={};state.paid[name]=!state.paid[name];fbSave('wc2026/paid',state.paid);render();}
// ── Countdown: to the draw (if a draw time is set & not yet drawn), else to kickoff ──
let _cdTimer=null;
const KICKOFF_MS=Date.parse('2026-06-11T20:00:00+01:00'); // opener, BST
function cdTarget(){
  if(!state.draw&&state.drawTime){const t=Date.parse(state.drawTime);if(!isNaN(t)&&t>Date.now()-3600000)return{time:t,label:'The draw is in',done:'🎲 Draw time — stand by!'};}
  if(Date.now()<KICKOFF_MS)return{time:KICKOFF_MS,label:'Tournament kicks off in',done:''};
  return null;
}
function cdText(){const t=cdTarget();if(!t)return'';const ms=t.time-Date.now();if(ms<=0)return t.done||'';const d=Math.floor(ms/864e5),h=Math.floor(ms/36e5)%24,m=Math.floor(ms/6e4)%60,s=Math.floor(ms/1e3)%60;let o='';if(d)o+=d+'d ';o+=String(h).padStart(2,'0')+'h '+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';return o;}
function countdownHTML(){const t=cdTarget();if(!t)return'';const txt=cdText();if(!txt)return'';return`<div class="cd-wrap" style="margin-bottom:14px;padding:12px 14px;background:var(--pill-gr);border:1px solid var(--pill-grbr);border-radius:12px;text-align:center;box-shadow:var(--shadow)"><div style="font-family:'Oswald',sans-serif;font-size:.6rem;letter-spacing:.16em;color:var(--gr);text-transform:uppercase">${t.label}</div><div id="countdown" style="font-family:'Oswald',sans-serif;font-size:1.55rem;font-weight:700;color:var(--tx);letter-spacing:.02em;margin-top:3px">${txt}</div></div>`;}
function startCountdown(){if(_cdTimer)return;_cdTimer=setInterval(()=>{
    try{checkAutoDraw();}catch(e){}
    const txt=cdText();
    if(txt){const ts=document.querySelectorAll('.tk-cd');if(ts.length)ts.forEach(el=>{el.textContent=txt;});}  // live ticker countdown
    const el=document.getElementById('countdown');if(!el)return;
    if(txt)el.textContent=txt;else{const w=el.closest('.cd-wrap');if(w)w.style.display='none';}
  },1000);}
function esc(s){return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function safeUrl(u){u=(u||'').trim();if(!u)return'';if(/^\s*javascript:/i.test(u))return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u;}
function donateLink(){return state.charity&&state.charity.on?safeUrl(state.charity.link):'';}
function donateBtnHTML(o){o=o||{};const url=donateLink();if(!url)return'';const big=o.big;const label=o.label||'Donate';
  return `<a href="${url.replace(/"/g,'&quot;')}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;align-items:center;justify-content:center;gap:7px;${big?'padding:12px 22px;font-size:.95rem;':'padding:7px 15px;font-size:.78rem;'}background:linear-gradient(135deg,#e0245e,#b81d4e);color:#fff;border-radius:${big?'11px':'8px'};font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.02em;text-decoration:none;box-shadow:0 3px 10px rgba(224,36,94,.32);border:none">❤ ${esc(label)}</a>`;}
function donateShow(place){
  if(!donateLink())return false;
  const e=(state.charity&&state.charity.emphasis)||'balanced';
  const hasGoal=(state.charity.goal||0)>0;
  if(place==='fund')return true;                         // thermometer only renders when goal>0 anyway
  if(place==='welcome')return e!=='subtle';
  if(place==='ticker')return e!=='subtle';
  if(place==='standings'){ if(e==='full')return true; if(e==='subtle')return false; return !hasGoal; }
  return false;
}
function thermometerHTML(){
  if(!state.charity.on||!state.charity.goal||state.charity.goal<=0)return'';
  const tot=state.charity.total||0,goal=state.charity.goal;
  const pct=Math.min(100,Math.round(tot/goal*100));
  return `<div class="card" style="padding:13px 15px;margin-bottom:14px;box-shadow:var(--shadow)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px"><span style="font-family:'Oswald',sans-serif;font-size:.72rem;letter-spacing:.06em;color:var(--tx)">❤ ${esc(state.charity.name)||'CHARITY'} FUND</span><span style="font-size:.76rem;color:var(--txm)"><b style="color:var(--gold);font-family:'Oswald',sans-serif;font-size:.95rem">£${tot.toLocaleString()}</b> of £${goal.toLocaleString()}</span></div>
    <div style="height:12px;background:var(--cardh);border-radius:7px;overflow:hidden"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#00a838,#00e676);border-radius:7px;transition:width .6s ease"></div></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px"><span style="font-size:.68rem;color:var(--txm)">${pct}% of the way there${pct>=100?' — goal smashed! 🎉':''}</span>${donateShow('fund')?donateBtnHTML({label:'Donate'}):''}</div>
  </div>`;
}

function render(){
  // Setup tab ONLY appears for signed-in admins — completely hidden otherwise
  const tabs=[];
  if(adminSess)tabs.push({id:'setup',l:'ADMIN'});
  const liveCount=state.draw?liveMatchIds().length:0;
  if(liveCount>0)tabs.push({id:'live',l:`LIVE (${liveCount})`});
  tabs.push(
    {id:'draw',l:'DRAW',d:!state.draw},
    {id:'fixtures',l:'FIXTURES',d:!state.draw},
    {id:'tables',l:'TABLES',d:!state.draw},
    {id:'knockout',l:'KNOCKOUT',d:!state.draw},
    {id:'standings',l:'STANDINGS',d:!state.draw}
  );
  // If current tab is no longer valid (e.g. signed out of setup, or no draw), redirect
  const validTab=tabs.find(t=>t.id===state.tab&&!t.d);
  if(!validTab){
    if(state.draw)state.tab='standings';
    else if(adminSess)state.tab='setup';
    else state.tab='draw'; // will show join/welcome screen
  }
  document.getElementById('tab-nav').innerHTML=tabs.map(t=>`<button class="tab-btn${state.tab===t.id?' active':''}${t.id==='live'?' live':''}" onclick="${t.d?'':'setTab(\''+t.id+'\')'}" ${t.d?'disabled':''} style="${t.d?'opacity:.25;cursor:not-allowed':''}">${t.l}</button>`).join('');
  updateHdr();
  const c=document.getElementById('content');
  if(state.tab==='setup'&&adminSess){c.innerHTML=renderSetup();if(state.sOpen.manual)renderManualPanel();}
  else if(state.tab==='setup'){c.innerHTML=renderDraw();}
  else if(state.tab==='live'){c.innerHTML=renderLive();}
  else if(state.tab==='draw')c.innerHTML=renderDraw();
  else if(state.tab==='fixtures')c.innerHTML=renderFixtures();
  else if(state.tab==='tables')c.innerHTML=renderTables();
  else if(state.tab==='knockout')c.innerHTML=renderKO();
  else if(state.tab==='standings')c.innerHTML=renderStandings();
  updateTicker();
  document.getElementById('mute-btn').textContent=state.muted?'🔇':'🔊';
  document.getElementById('mute-btn').className='hbtn'+(state.muted?' dim':'');
  // Show sign-out button only when signed in — invisible to regular users
  const lw=document.getElementById('lock-btn-wrap');
  if(lw){lw.innerHTML=isAdmin()?`<button class="hbtn" onclick="_so()" title="Sign out" style="font-size:.7rem;opacity:.75">🗝️</button>`:'';}
  updateResultsBanner();
  startCountdown();
  checkGate();
}

// ── MISC ─────────────────────────────────────────────────────────────────────
async function doReset(){if(!adminSess){showToast('Admin sign-in required','error');return;}await fbDel('wc2026/draw');await fbDel('wc2026/gr');await fbDel('wc2026/ko');state.draw=null;state.grR={};state.koR={};Object.keys(tempS).forEach(k=>delete tempS[k]);editing.clear();recentResults=[];manualMap={};pendingImports=[];state.tab='setup';render();showToast('Everything reset');}
function protectedRunDraw(){requirePin(runDraw);}
function protectedReset(){if(!adminSess){showToast('Admin sign-in required','error');return;}showMod('Reset everything?','This will permanently delete the draw and all results.','YES RESET',doReset,true);}
async function copyDraw(){const lb=calcLeaderboard();const lines=[`🏆 ${CONFIG.title}`,'Drawn: '+new Date(state.draw.drawnAt).toLocaleString('en-GB'),''];lb.forEach((p,i)=>{lines.push(`${MEDAL[i]||(i+1)+'.'} ${p.name} — ${p.total} pts`);p.breakdown.forEach(t=>lines.push(`   ${t.flag} ${t.name} (Grp ${t.group})`));lines.push('');});try{await navigator.clipboard.writeText(lines.join('\n'));showToast('Copied!','gold');}catch{showToast('Copy failed','error');}}
function adjKo(id,side,d){if(!tempS[id])tempS[id]={hg:0,ag:0};tempS[id][side]=Math.max(0,(tempS[id][side]||0)+d);const el=document.getElementById(`sk${side}${id}`);if(el)el.textContent=tempS[id][side];const ps=document.getElementById(`pens-${id}`);if(ps)ps.style.display=(tempS[id].hg===tempS[id].ag)?'flex':'none';}

// ── INIT ──────────────────────────────────────────────────────────────────────
// Register service worker for PWA / offline support
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // Check for updates every time the app loads
    reg.update();
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw&&nw.addEventListener('statechange',()=>{
        if(nw.state==='installed'&&navigator.serviceWorker.controller){
          // New version available — reload to use it
          showToast('Updating to latest version…');
          setTimeout(()=>location.reload(),1200);
        }
      });
    });
  }).catch(()=>{});
}
initTheme();
// Set title from config
if(CONFIG.title){document.title=CONFIG.title;const t=document.querySelector('.hdr-title');if(t)t.textContent=CONFIG.title;}

// Shared URL param (read-only snapshot links)
// Admin access via Firebase Auth — no URL tricks needed
if(loadFromURL()){hideLoading();setConnDot('#f59e0b','Read-only snapshot (no live sync)');render();}
else if(DB){
  // ── FIREBASE MODE: real-time listener syncs all users ─────────────────────
  setLoadMsg('Connecting to Firebase…');
  let first=true;
  // Auth state — adminSess true only when signed into Firebase Auth
  let _authInit=false;
  firebase.auth().onAuthStateChanged(user=>{
    const prev=adminSess;
    adminSess=!!user;
    if(_authInit){
      render();
      if(user&&!prev){
        showToast('Admin mode active 🗝️','gold');
        // Auto-import any queued results immediately on sign-in
        if(pendingImports.length)_autoImport(pendingImports).then(()=>{pendingImports=[];});
        // Trigger a fresh poll
        setTimeout(pollResults,1000);
      } else if(!user&&prev){
        showToast('Signed out');
      }
    }
    _authInit=true;
  });

  DB.ref('wc2026').on('value',snap=>{
    const data=snap.val()||{};
    state.draw=data.draw||null;
    state.grR=data.gr||{};
    state.live=data.live||{};
    state.koR=data.ko||{};
    _accessHash=data.accessHash||null;
    if(data.cfg){
      if(data.cfg.scoring)state.scoring={...DEF_SCR,...data.cfg.scoring};
      if(data.cfg.prize)state.prize={...{on:false,buyin:5,pay:[60,30,10]},...data.cfg.prize};
      if(data.cfg.charity)state.charity={...{on:true,name:'',suggested:10,total:0,goal:0,link:'',emphasis:'balanced'},...data.cfg.charity};
      if(data.cfg.podium)state.podium={...{on:false,prizes:['','','']},...data.cfg.podium};
      if(data.cfg.predict)state.predict={...{on:false,bonus:10},...data.cfg.predict};
      if(data.cfg.ticker)state.ticker={...{on:true,messages:[]},...data.cfg.ticker};
      state.gateSignupOnly=data.cfg.gateSignupOnly!==false;
      state.footballApiKey=data.cfg.footballApiKey||'';
      state.autoDraw=!!data.cfg.autoDraw;
      state.drawByTeam=!!data.cfg.drawByTeam;
      state.drawTime=data.cfg.drawTime||'';
      if(data.cfg.names)state.names=[...data.cfg.names,...Array(MAX_PLAYERS).fill('')].slice(0,MAX_PLAYERS);
      if(data.cfg.pc)state.pc=data.cfg.pc;
      state.paid=data.paid||{};
      state.signups=data.signups||{};
      state.signupOpen=data.signupOpen||false;
      if(data.cfg.muted!==undefined)state.muted=data.cfg.muted;
      
    }
    if(first){
      first=false;
      if(state.draw)state.tab='draw';
      checkGate();
      hideLoading();
    }
    recentResults=Object.entries(state.grR).filter(([_,r])=>r.played).slice(-8).map(([id,r])=>{const f=GF[id];return f?{home:f.home,away:f.away,hg:r.hg,ag:r.ag}:null;}).filter(Boolean).reverse();
    render();
    maybePlayCeremony();
  },err=>{console.error('Firebase error:',err);hideLoading();setConnDot('#ef4444','Firebase connection failed — using local storage');localInit();});
  DB.ref('.info/connected').on('value',s=>{setConnDot(s.val()?'#00e676':'#f59e0b',s.val()?'Connected · Live sync active':'Reconnecting…');});
  startPolling();
} else {
  // ── LOCAL STORAGE MODE: single-device, no sync ────────────────────────────
  setLoadMsg('Loading…');setConnDot('#f59e0b','Local mode — Firebase not configured');
  localInit();
}

async function localInit(){
  
  const s=await sGet('wc26h:cfg');
  if(s){if(s.pc)state.pc=Math.max(2,Math.min(24,s.pc));if(s.names)state.names=[...s.names,...Array(24).fill('')].slice(0,24);if(s.scoring)state.scoring={...DEF_SCR,...s.scoring};if(s.prize)state.prize={...{on:false,buyin:5,pay:[60,25,15]},...s.prize};if(s.muted!==undefined)state.muted=s.muted;}
  const d=await sGet('wc26h:draw');if(d){state.draw=d;state.tab='draw';}
  const gr=await sGet('wc26h:gr');if(gr){state.grR=gr;recentResults=Object.entries(gr).filter(([_,r])=>r.played).slice(-8).map(([id,r])=>{const f=GF[id];return f?{home:f.home,away:f.away,hg:r.hg,ag:r.ag}:null;}).filter(Boolean).reverse();}
  const ko=await sGet('wc26h:ko');if(ko)state.koR=ko;
  hideLoading();startPolling();render();
}

</script>
